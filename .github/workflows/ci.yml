name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build e testes
    runs-on: ubuntu-latest

    # Os testes do adapter Postgres provam INV-004 e INV-005 (sequência densa sob
    # escrita concorrente). Sem o serviço eles se pulam sozinhos, e a garantia
    # deixaria de ser verificada em silêncio — por isso o banco sobe aqui.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://audit:audit@localhost:5432/audit_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instala dependências
        run: npm ci

      # Perfil de lint cobre src/ e tests/; o tsconfig de build exclui tests por
      # causa do rootDir, então sem este perfil os testes nunca seriam checados.
      - name: Typecheck (src + tests)
        run: npm run lint

      # Dependência com vulnerabilidade conhecida é o caminho de entrada mais
      # barato num sistema que custodia certificado A1 de terceiro. Falha em
      # `high` e `critical`; `moderate` não trava o build para não virar ruído
      # que todo mundo aprende a ignorar.
      - name: Vulnerabilidade em dependência
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Testes com cobertura
        run: npm run test:coverage

      # Guarda contra o skipIf silencioso: se a suíte de Postgres for pulada, o
      # CI passaria verde sem ter verificado o lock por CNPJ.
      - name: Confirma que a suíte de Postgres rodou
        run: npx vitest run tests/infrastructure --reporter=verbose 2>&1 | grep -q 'serializa escritas concorrentes'

      # INV-006: o hash da projeção é a trilha de defesa do produto. Se o replay
      # deixar de ser determinístico, a CI falha aqui com exit code 3.
      #
      # O passo era vácuo até aqui: rodava sem `DATABASE_URL`, sobre um
      # `.roadmap/activity.jsonl` de zero bytes, e passava sempre — inclusive
      # sem ter verificado nada. Um guard que passa em qualquer situação não
      # guarda, carimba. Agora semeia um log determinístico no Postgres e
      # verifica contra ele, com `--strict` para que "nada a verificar" seja
      # falha e não sucesso silencioso.
      - name: Semeia um event log determinístico
        run: npx tsx scripts/semear-log-de-ci.ts

      - name: Verifica integridade da projeção (INV-006)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npx tsx src/cli/audit.ts verify --strict \
            --tenant 11111111-1111-1111-1111-111111111111 \
            --cnpj 11222333000181

  # Job próprio por causa do `fetch-depth: 0`.
  #
  # O `actions/checkout` traz só o último commit por padrão, e o gitleaks varre
  # faixas de commit: com o histórico raso ele morre em `unknown revision` no
  # `<sha>^`. Foi exatamente o que aconteceu quando este passo vivia dentro do
  # build — e o comentário ali dizia "roda no histórico inteiro", que era falso.
  #
  # Clonar o histórico inteiro custa tempo, então custa só aqui, e não no job que
  # compila e roda a suíte.
  segredos:
    name: Segredo no repositório
    runs-on: ubuntu-latest

    steps:
      # Segredo commitado não é hipótese neste projeto: o `.env` do frontend
      # ficou versionado por meses (só com variáveis públicas, mas sem nada
      # impedindo a próxima).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Valida docs/api/openapi.yaml
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  image:
    name: Imagem de produção
    runs-on: ubuntu-latest

    # O mesmo Postgres do job de testes: aqui ele serve para provar que o
    # contêiner ATENDE, e não só que builda.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t audit-api:ci .

      # O `tsc` não vê leitura de disco, então uma dependência de runtime fora de
      # `src/` passa por todo o resto do CI e só quebra no deploy. Foi o que
      # aconteceu com `config/esaa.config.yaml`, que o servidor carrega no start
      # para montar o AGENT_CONTRACT da camada 5. Este passo sobe o contêiner de
      # verdade e exige resposta.
      - name: O contêiner atende
        run: |
          docker run -d --name api --network host \
            -e AUDIT_ENV=dev \
            -e DATABASE_URL="postgres://audit:audit@localhost:5432/audit_test" \
            -e SUPABASE_URL="https://projeto-de-ci.supabase.co" \
            -e SUPABASE_ANON_KEY="chave-de-ci" \
            -e SUPABASE_JWT_SECRET="segredo-de-ci-que-nao-vai-para-producao" \
            -e CERTIFICATE_MASTER_KEY="chave-mestra-de-ci-com-mais-de-32-caracteres" \
            -e API_PORT=3000 audit-api:ci

          for i in $(seq 1 20); do
            if curl -sf --max-time 2 http://localhost:3000/v1/health >/dev/null; then
              echo "respondeu na tentativa $i"
              exit 0
            fi
            sleep 1
          done

          echo "::error::O contêiner não respondeu em /v1/health"
          docker logs api
          exit 1

      # Encerrar sem terminar a requisição em voo é perder um append no meio, num
      # log append-only. O handler de SIGTERM tem de existir e ser rápido.
      - name: Desligamento limpo
        run: |
          timeout 15 docker stop api
          test "$(docker inspect --format '{{.State.ExitCode}}' api)" = "0"
