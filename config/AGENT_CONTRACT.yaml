# =============================================================================
# Contrato dos agentes fiscais.
#
# Substitui os dez agentes de engenharia de software (tech-lead, coder, tester…)
# pelos cinco do domínio fiscal. A regra estrutural continua a mesma, e é o que
# se vende ao escritório: **só o orquestrador escreve no event log**. Agente
# propõe; a proposta é revisada e confirmada por humano, com trilha.
#
# `writable` vazio nega escrita. `forbidden` tem precedência sobre `writable`.
# Usuários não aparecem aqui: eles agem através da API, que é o orquestrador, e
# não têm fronteira de arquivo — ver ContractEnforcerService.
# =============================================================================

agents:
  # Coleta DF-e, upload manual, SPED e extrato. Faz staging, não apura.
  collector:
    task_kind: impl
    allowed_actions:
      - issue.report
    boundaries:
      readable:
        - data/
        - docs/
      writable:
        - data/staging/
      forbidden:
        - data/events/
        - config/

  # Propõe classificação de item. Nunca confirma: confirmar é ato do contador.
  classifier:
    task_kind: spec
    allowed_actions:
      - item.classify
      - issue.report
    boundaries:
      readable:
        - data/
        - docs/
      writable:
        - data/catalog/proposals/
      forbidden:
        - data/events/
        - data/catalog/confirmed/
        - config/

  # Roda as trilhas de auditoria e sinaliza crédito suspeito. Não altera nada.
  auditor:
    task_kind: qa
    allowed_actions:
      - issue.report
      - credit.flag
    boundaries:
      readable:
        - data/
        - docs/
      writable:
        - data/reports/
      forbidden:
        - data/events/
        - data/catalog/
        - config/

  # Assistente fiscal (Onda 9). Somente leitura, sem exceção: toda resposta cita
  # event_seq, e ações recomendadas voltam como sugestão para o usuário executar.
  reconciler:
    task_kind: review
    allowed_actions:
      - assessment.review
    boundaries:
      readable:
        - data/
        - docs/
      writable: []
      forbidden:
        - data/
        - config/

  # Orquestrador: o único agente que efetiva estado, e só via orquestrador.
  closer:
    task_kind: orchestrator
    allowed_actions:
      - assessment.projected
      - assessment.adjusted
      - assessment.confirmed
      - period.opened
      - period.closed
      - rectification.filed
      - credit.recognized
      - credit.conditioned
      - credit.released
      - output.rejected
      # Coleta de DF-e agendada (ADR-007): sem quem pediu, o uso do A1, a nota
      # que ele traz e o cancelamento dela saem em nome do orquestrador.
      - certificate.used
      - doc.received
      - doc.cancelled
    boundaries:
      readable:
        - data/
        - docs/
      writable:
        - data/events/
      forbidden: []
