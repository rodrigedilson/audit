openapi: 3.0.3
info:
  title: audit — API fiscal (ESAA-Flow)
  version: 1.0.0
  description: |
    Contrato mínimo para destravar o frontend (Lovable). Toda escrita passa pelo
    orquestrador single-writer: o cliente envia uma *intenção*; a API valida
    (7 camadas), grava o evento e re-projeta. Leituras vêm da projeção.

    Convenções:
    - Identificadores em inglês; mensagens de erro em PT-BR.
    - `cnpj` sempre com 14 dígitos, sem máscara.
    - `period` no formato `YYYY-MM` (competência).
    - Toda resposta de escrita devolve o `event_seq` gravado e o `projection_hash`.
    - Recurso fora do plano do CNPJ responde `403` com `code: feature_not_in_plan`,
      `feature`, `regime` e `plans_with_feature` (os regimes cujo plano o inclui).
      O plano é por regime, e o que cada um inclui vem de `GET /plans`. O mapa
      rota → feature está em `src/api/plugins/plan-gate.ts`. `/deadlines`, que é
      da carteira, abre se algum CNPJ dela tiver `calendario`.
servers:
  - url: http://localhost:3000/v1
    description: desenvolvimento
  - url: https://api.SEU-DOMINIO.com.br/v1
    description: produção

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: portfolio
    description: Carteira do escritório (CNPJs, regimes, períodos)
  - name: ingestion
    description: Entrada de documentos fiscais, SPED e extratos
  - name: catalog
    description: Cadastro de itens e saúde de classificação
  - name: assessment
    description: Apuração dual (tributos atuais × IBS/CBS)
  - name: credit
    description: Crédito em risco por fornecedor, extrato bancário e casamento de pagamento
  - name: dossier
    description: EFD-Contribuições e o dossiê de saldo credor PIS/Cofins
  - name: reconciliation
    description: Contra-apuração, crédito em risco, prazos
  - name: simulation
    description: Cenários Integrado × Híbrido × Presumido
  - name: reporting
    description: Trilhas de auditoria e Book de fechamento
  - name: certificates
    description: Cofre de certificados A1 com log de uso
  - name: assistant
    description: Assistente fiscal somente leitura sobre o event log
  - name: events
    description: Event log e verificação de projeção
  - name: billing
    description: Planos, calculadora pública de preço e assinatura
  - name: public
    description: >
      Superfície sem autenticação. Existe para ser usada antes de qualquer
      cadastro — é onde o visitante descobre que tem o problema.

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login do usuário do escritório
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      summary: Usuário e tenant atuais
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tenant: { $ref: "#/components/schemas/Tenant" }

  # ----------------------------------------------------------- portfolio
  /users:
    get:
      tags: [auth]
      summary: Quem tem acesso a este escritório, e com que papel
      description: |
        **Leitura, e só.** Convidar, remover e trocar papel não existem na API:
        hoje isso se faz direto no banco, e a resposta declara esse estado em
        `management_available` para a tela não oferecer botões que não levam a
        lugar nenhum.

        Qualquer membro lista — saber quem mais tem acesso não é informação
        sensível dentro do escritório, e é o que permite a um `viewer` saber a
        quem pedir uma operação que ele não pode fazer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users, total, emails_available, management_available]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        email:
                          type: string
                          nullable: true
                          description: |
                            `null` quando `emails_available` é `false`. Não
                            significa que o usuário não tem e-mail.
                        role: { type: string, enum: [owner, accountant, viewer] }
                        created_at: { type: string, format: date-time }
                        is_you: { type: boolean }
                  total: { type: integer }
                  emails_available:
                    type: boolean
                    description: |
                      O e-mail mora em `auth.users`, do Supabase. Em Postgres
                      puro — CI e desenvolvimento — o schema não existe, e a
                      rota responde sem e-mail em vez de falhar.
                  management_available:
                    type: boolean
                    description: Sempre `false` hoje. Não há rota de convite nem de remoção.

  /clients:
    get:
      tags: [portfolio]
      summary: Lista CNPJs da carteira
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: regime
          schema: { $ref: "#/components/schemas/Regime" }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
          description: |
            Filtra pelo status do CNPJ na carteira. É a base da cobrança: só
            `active` é faturado.
        - in: query
          name: state
          schema: { $ref: "#/components/schemas/PeriodState" }
          description: |
            Filtra pelo estado da competência corrente. CNPJ sem competência
            aberta não aparece em nenhum valor deste filtro.
      responses:
        "200":
          description: Página de clientes com resumo do período corrente
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClientSummary" }
                  page: { type: integer }
                  total: { type: integer }
    post:
      tags: [portfolio]
      summary: Cadastra um CNPJ (emite `client.enrolled`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreate" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [portfolio]
      summary: Detalhe do cliente
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [portfolio]
      summary: Atualiza regime, certificado ou dados cadastrais
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }

  /clients/{cnpj}/periods:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [portfolio]
      summary: Períodos (competências) do cliente com estado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Period" }
    post:
      tags: [portfolio]
      summary: Abre competência (emite `period.opened`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { $ref: "#/components/schemas/PeriodId" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  # ----------------------------------------------------------- ingestion
  /clients/{cnpj}/documents:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [ingestion]
      summary: Lista documentos fiscais do cliente
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: direction
          schema: { type: string, enum: [inbound, outbound] }
        - in: query
          name: has_issues
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSummary" }
                  total: { type: integer }
    post:
      tags: [ingestion]
      summary: Upload manual de XML (um ou vários; emite `doc.received` por documento aceito)
      description: |
        Cada XML passa pelo pipeline de 7 camadas. Documentos rejeitados não geram
        `doc.received`; geram `output.rejected` e voltam em `rejected[]`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "207":
          description: Resultado por arquivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: array
                    items: { $ref: "#/components/schemas/WriteResult" }
                  rejected:
                    type: array
                    items: { $ref: "#/components/schemas/Rejection" }

  /clients/{cnpj}/documents/{access_key}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - in: path
        name: access_key
        required: true
        description: >
          Chave de acesso, 44 posições. Letras maiúsculas só nas 12 do CNPJ do
          emitente (CNPJ alfanumérico, NT Conjunta 2025.001).
        schema: { type: string, pattern: "^[0-9]{6}[0-9A-Z]{12}[0-9]{26}$" }
    get:
      tags: [ingestion]
      summary: Documento com itens, tributos atuais e IBS/CBS lado a lado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/sync:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [ingestion]
      summary: Dispara coleta na distribuição DF-e (assíncrono)
      description: >
        ADR-006. Enfileira a coleta; o worker consulta a SEFAZ por NSU com o A1
        do cliente, ingere as NF-e completas das competências abertas pelo mesmo
        caminho do upload e registra a ciência da operação (210210) dos resumos
        de entrada. A NF-e de entrada chega completa na coleta seguinte à
        ciência. Com coleta pendente, devolve o mesmo job (`reused: true`).
      responses:
        "202":
          description: Job aceito
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Job"
                  - type: object
                    properties:
                      reused: { type: boolean }
        "409":
          description: >
            Sem certificado (`dfe_no_certificate`), certificado guardado antes da
            coleta e que precisa ser reenviado (`dfe_certificate_not_usable`) ou
            cliente sem UF (`dfe_missing_uf`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            A SEFAZ só aceita nova consulta a partir de `retry_at` (cabeçalho
            `Retry-After`). Consultar antes conta como consumo indevido (656).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Coleta indisponível no ambiente (`dfe_gateway_not_configured`). Esperado em dev.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clients/{cnpj}/dfe:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [ingestion]
      summary: Estado da coleta de DF-e do CNPJ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnpj: { type: string }
                  available: { type: boolean, description: "Há gateway da SEFAZ neste ambiente." }
                  ult_nsu: { type: string, nullable: true }
                  max_nsu: { type: string, nullable: true }
                  last_cstat: { type: string, nullable: true }
                  last_message: { type: string, nullable: true }
                  last_run_at: { type: string, format: date-time, nullable: true }
                  next_allowed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Antes disso, POST /sync responde 429.
                  summaries:
                    type: object
                    properties:
                      awaiting_acknowledgement: { type: integer }
                      awaiting_full_xml: { type: integer }
                      acknowledgement_failed: { type: integer }
                  documents:
                    type: object
                    properties:
                      awaiting_period_open:
                        type: integer
                        description: NF-e baixada de competência ainda não aberta; entra na coleta seguinte à abertura.
                      rejected_by_pipeline: { type: integer }
                  auto_sync:
                    $ref: "#/components/schemas/DfeAutoSync"
                  cancellations_needing_rectification:
                    type: array
                    description: Nota cancelada na SEFAZ depois da confirmação da competência; a correção é a retificação.
                    items:
                      type: object
                      properties:
                        access_key: { type: string }
                        tp_evento: { type: string }
                        protocol: { type: string, nullable: true }
                        cancelled_at: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/capag:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [ingestion]
      summary: CAPAG presumida do CNPJ
      description: >
        O último demonstrativo do REGULARIZE enviado, com a conferência, e a
        fórmula de referência por grupo, lida em fonte pública. A referência é
        sempre `verified: false`: a fórmula oficial só aparece no REGULARIZE, com
        login do contribuinte (Portaria PGFN 6.757/2022, art. 28).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnpj: { type: string }
                  extractor_configured: { type: boolean }
                  statement:
                    type: object
                    nullable: true
                    description: O último demonstrativo, ou null quando nenhum foi enviado.
                    allOf:
                      - $ref: "#/components/schemas/CapagStatement"
                  reference_formulas:
                    type: array
                    items:
                      type: object
                      properties:
                        group: { type: string }
                        income_multiplier: { type: number }
                        terms: { type: array, items: { type: object } }
                        sources: { type: array, items: { type: object } }
                        legal_basis: { type: string, nullable: true }
                        extracted_at: { type: string, format: date-time }
                        verified: { type: boolean, enum: [false] }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/capag/statements:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [ingestion]
      summary: Envia o demonstrativo de CAPAG do REGULARIZE (PDF ou HTML)
      description: >
        O modelo transcreve fórmula, valores, CAPAG, dívida e classificação, cada
        número com o trecho literal do documento. O código confere que cada
        trecho está no texto e que o número está no trecho, lê os valores e
        refaz a conta. `verified` é `true` só quando a fórmula do demonstrativo,
        aplicada aos valores dele, chega à CAPAG impressa (tolerância de R$ 1).
        O arquivo não é guardado, só o extraído e o SHA-256. Owner ou accountant;
        10 por hora por escritório.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Demonstrativo extraído e registrado, conferido ou não.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnpj: { type: string }
                  statement: { $ref: "#/components/schemas/CapagStatement" }
        "400": { description: "Arquivo ausente, acima de 5 MB, ou PDF sem texto (digitalizado)." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: "Mais de 10 demonstrativos na última hora (`rate_limited`)." }
        "503": { description: "Sem ANTHROPIC_API_KEY neste ambiente (`capag_extractor_not_configured`)." }

  /clients/{cnpj}/dfe/auto:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    put:
      tags: [ingestion]
      summary: Liga ou desliga a coleta agendada do CNPJ (ADR-007)
      description: >
        Só o owner. Com a opção ligada, o agendador enfileira a coleta sozinho,
        uma vez por hora no máximo, e o A1 é usado em nome do orquestrador
        (`closer`), com quem ligou no payload do `certificate.used`. Ligar exige
        certificado utilizável (`409 dfe_certificate_not_usable` ou
        `dfe_no_certificate`). Onde não há gateway da SEFAZ (dev), `503`. A
        mudança vai para o log como `client.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Estado da opção depois da mudança.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnpj: { type: string }
                  auto_sync:
                    $ref: "#/components/schemas/DfeAutoSync"
        "403": { description: "Só o owner liga a coleta agendada, ou o plano do CNPJ não inclui coleta_dfe (`feature_not_in_plan`)." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Sem certificado A1 (`dfe_no_certificate`) ou com certificado que não abre sem senha (`dfe_certificate_not_usable`)." }
        "503": { description: "Sem gateway da SEFAZ neste ambiente (`dfe_gateway_not_configured`)." }

  /clients/{cnpj}/sped:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [dossier]
      operationId: importSped
      summary: Importa a EFD-Contribuições do cliente
      description: >
        Síncrono, e `201` em vez de `202` com job: o arquivo é o que o cliente já
        gera hoje, e é a fonte de verdade do saldo credor de PIS/Cofins.


        Lê os registros de que o dossiê precisa — `0000`, `C100`, `C170`, `M100`,
        `M500`, `1100` e `1500` — e conta os demais sem interpretá-los. Um parser
        que anunciasse ler o layout inteiro e ignorasse metade em silêncio seria
        pior do que um que diz o que lê.


        **Versão de layout desconhecida é recusada**, não lida no palpite: entre
        versões os campos mudam de posição, e adivinhar trocaria base por valor.


        O CNPJ do arquivo é conferido contra o do escopo antes de qualquer
        gravação. Divergência devolve `tenant_violation`: importar a EFD de um
        CNPJ na conta de outro produziria um dossiê que acusa o cliente errado.


        Uma escrituração por competência: a retificadora substitui a original,
        como na própria EFD. Manter as duas daria dois saldos credores para o
        mesmo mês e nenhum defensável.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Escrituração importada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpedImportOutcome" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/credit-dossier/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [dossier]
      operationId: getCreditDossier
      summary: Dossiê de saldo credor PIS/Cofins, com o lastro documental de cada crédito
      description: |
        O diferencial #9: crédito sem lastro documental será perdido no
        pente-fino, e a Nota Técnica RFB 011/2026 restringe a EFD-Contribuições a
        retificação e saldos a partir de 2027 — o que faz do saldo credor
        acumulado um ativo com prazo para ser defendido.

        **A honestidade central:** a ausência de um documento na nossa base não
        prova que o crédito é indevido. Se o escritório só começou a ingerir XML
        em 2026, um crédito de 2023 não tem como ser conferido aqui, e reportá-lo
        como `sem_documento` acusaria o cliente de um problema que é nosso. Por
        isso `nao_verificavel` é um estado de primeira classe, e a janela de
        cobertura vem na resposta.

        O dossiê é **derivado na leitura**, e não um resultado guardado.
        Congelá-lo esconderia o ganho de lastro de quando o escritório localiza
        um XML que faltava — e localizar documento é exatamente o trabalho que o
        dossiê encomenda.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditDossier" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/efd-icms-ipi:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [reconciliation]
      operationId: importEfdIcmsIpi
      summary: Importa a EFD ICMS/IPI do cliente
      description: >
        Rota própria, e não a `/sped` da EFD-Contribuições. São duas escriturações
        com posições de campo próprias, e um endpoint que adivinhasse qual é pelo
        conteúdo erraria em silêncio no caso que importa: arquivo do tipo errado
        lido com as posições do outro devolve base no lugar de valor.


        Onde os dois leiautes divergem é no `0000` — `DT_INI` no campo 4 contra 6,
        `CNPJ` no 7 contra 9. `C100` e `C170` são idênticos nos dois, o que torna
        a confusão silenciosa e a recusa pelo cabeçalho obrigatória.


        Lê `0000`, `C100`, `C170`, `C190`, `E110` e `E520`, e conta os demais sem
        interpretá-los. São aceitos os leiautes **019** (obrigatório desde
        01/01/2025) e **020** (desde 01/01/2026): os seis registros foram
        extraídos dos Guias Práticos 3.1.9 e 3.2.2 e comparados campo a campo,
        e são idênticos nos dois. Versão fora dessa lista é recusada, e não lida
        no palpite.


        Convive com a EFD-Contribuições da mesma competência: são escriturações
        diferentes, e uma não substitui a outra. Dentro de cada uma, a
        retificadora substitui a original.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Escrituração importada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EfdIcmsImportOutcome" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/icms-ipi-reconciliation/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [reconciliation]
      operationId: getIcmsIpiReconciliation
      summary: Confere a EFD ICMS/IPI contra as regras do próprio guia
      description: |
        O arquivo declara a apuração no `E110` e no `E520` e declara os documentos
        que a sustentam nos blocos C. Nada garante que os dois concordem: o PVA
        aceita arquivo cuja apuração não fecha com os documentos, e quem recebe a
        conta é o contribuinte, meses depois.

        Refaz a aritmética que o guia manda o arquivo obedecer e soma os
        documentos contra o declarado. Não é opinião nossa sobre quanto deveria
        ser: é a escrituração conferida contra as regras dela.

        **Conferência que não pôde rodar vem `not_verified` com motivo, nunca
        `passed`.** Sem `E110` não há apuração declarada para conferir, o que não
        é o mesmo que apuração correta; documento sem `C170` não é documento
        errado, porque a NF-e de emissão própria costuma vir só com `C100` e
        `C190`. A soma contra o `E110` usa a lista de registros do guia
        (validação dos campos 02 e 06): C190, C590, D190 e D590 nos dois lados,
        e C320, C390, C490, C690, C790 e C890 nos débitos. Quando o arquivo traz
        um registro da lista que este leitor ainda não soma (C850, D300, D390,
        D410, D690, D696, D730, D760), aquele lado vem `not_verified`: comparar
        sem ele acusaria uma diferença que é limitação nossa.

        A conciliação é **derivada na leitura**, e não um resultado guardado:
        congelada, uma conferência nova valeria só para arquivo importado depois
        dela, e o cliente continuaria vendo o veredito velho sobre o mesmo
        arquivo.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcmsIpiReconciliation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/bank-statements:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [credit]
      operationId: importBankStatement
      summary: Importa extrato (OFX ou CSV) e refaz o casamento com os documentos de entrada
      description: >
        O extrato é informação **fiscal** nesta rota, e não financeira: o crédito
        de IBS/CBS é condicionado à extinção do tributo da etapa anterior, e sob
        split payment a extinção acontece na liquidação. Sem saber se o
        fornecedor foi pago, não há como dizer nada sobre o crédito.


        Síncrono, e `201` em vez de `202` com job: o parse e o casamento são
        rápidos, e enfileirar sem consumidor deixaria o escritório esperando um
        job que nunca sai de `queued`. O caminho de open finance continua sendo o
        desejável, e quando existir entra como outra origem do mesmo módulo.


        A importação é **idempotente pelo `FITID`** do OFX (ou pela coluna `id` do
        CSV): o mesmo extrato enviado duas vezes não dobra o pagamento, e
        `lines_duplicated` diz quantas linhas já existiam — para o usuário não
        concluir que o arquivo não entrou.


        Depois de gravar, o casamento pagamento × documento é refeito por
        inteiro. Ver `POST /payment-matches`.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          text/plain:
            schema: { type: string, description: "OFX, que é SGML e não XML." }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Extrato importado e casamento refeito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementImportOutcome" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/payment-matches:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [credit]
      operationId: rematchPayments
      summary: Refaz o casamento pagamento × documento, sem importar nada
      description: >
        Útil depois de ingerir documentos novos: um lançamento que não tinha
        candidato passa a ter, e uma ambiguidade pode se resolver.


        Refeito por inteiro, e não incremental: um lançamento novo pode desfazer
        uma ambiguidade anterior, e um casamento incremental manteria a hipótese
        velha ao lado da nova.


        **Não grava evento fiscal**: casamento é conclusão sobre dados já no log,
        não fato novo.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [matches, total, ambiguous]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentMatch" }
                  total: { type: integer }
                  ambiguous:
                    type: integer
                    description: Casamentos que o sistema recusou resolver. Precisam de decisão humana.
        "403": { $ref: "#/components/responses/Forbidden" }

  /jobs/{job_id}:
    get:
