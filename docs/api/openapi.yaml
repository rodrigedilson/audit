  /clients/{cnpj}/books/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [reporting]
      operationId: listBooks
      summary: Books de fechamento gerados para a competência, do mais recente ao mais antigo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [books, total]
                properties:
                  books:
                    type: array
                    items: { $ref: "#/components/schemas/Book" }
                  total: { type: integer }
    post:
      tags: [reporting]
      operationId: generateBook
      summary: Gera o Book de fechamento (emite `book.generated`)
      description: >
        Síncrono: responde `201` com os metadados do Book já renderizado. Os bytes
        do PDF ficam guardados e o download não os regera — o hash impresso no
        rodapé tem de continuar valendo depois que uma regra mudar.
        Exige a competência apurada; uma competência apenas aberta é recusada com
        `422`. Gerar o Book de uma competência **confirmada** é permitido: é o caso
        de uso previsto, e a camada 6 não o trata como mutação.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                audience:
                  type: string
                  enum: [accountant, business_owner]
                  default: accountant
                include_trace:
                  type: boolean
                  description: >
                    Memória de cálculo em anexo. Por omissão sai `true`, exceto
                    quando `audience` é `business_owner`.
                white_label:
                  type: boolean
                  default: false
                  description: >
                    Omite a marca do produto. Entitlement de plano: só em CNPJ de
                    Lucro Presumido ou Lucro Real. Pedi-lo em outro regime é
                    recusado com `403` — a verificação é do servidor, e não da
                    tela.
      responses:
        "201":
          description: Book gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "403":
          description: >
            `white_label` pedido em CNPJ cujo regime não inclui o entitlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/books/{period}/{book_id}/download:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
      - in: path
        name: book_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [reporting]
      operationId: downloadBook
      summary: Baixa os bytes guardados do PDF (hash da projeção no rodapé de toda página)
      responses:
        "200":
          description: PDF
          headers:
            X-Book-SHA256:
              description: >
                SHA-256 do próprio arquivo, para o destinatário conferir o PDF que
                recebeu sem precisar abri-lo.
              schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------- certificates
  /clients/{cnpj}/certificate:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [certificates]
      summary: Metadados do certificado A1 do cliente (nunca retorna o PFX)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [certificates]
      summary: Armazena ou substitui o certificado (emite `certificate.stored`; PFX cifrado em repouso)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pfx, password]
              properties:
                pfx: { type: string, format: binary }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "422": { $ref: "#/components/responses/Rejected" }
    delete:
      tags: [certificates]
      summary: Remove o certificado (emite `certificate.removed`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }

  /clients/{cnpj}/certificate/usage:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [certificates]
      summary: Log de uso do certificado (projeção dos eventos `certificate.used`)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificateUsage" }
                  total: { type: integer }

  /certificates/expiring:
    get:
      tags: [certificates]
      summary: Certificados da carteira que vencem nos próximos N dias
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 60, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CertificateInfo" }

  # ----------------------------------------------------------- assistant
  /assistant/capabilities:
    get:
      tags: [assistant]
      operationId: getAssistantCapabilities
      summary: O que o assistente sabe responder, e com que camada
      description: >
        Independe de CNPJ. A lista é fechada de propósito: são as perguntas que o
        produto responde a partir dos dados, com citação conferível. Pergunta fora
        dela vai para a camada 3 quando há modelo configurado: o modelo responde
        só sobre os fatos que as consultas da lista trouxeram, cita-os, e a
        resposta passa pela mesma checagem de citação. Sem modelo, a pergunta
        fora da lista recebe "não sei, e eis o que sei".
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [supported, deterministic_only, language_model_configured]
                properties:
                  supported:
                    type: array
                    items:
                      type: object
                      properties:
                        intent: { type: string }
                        description: { type: string }
                  deterministic_only:
                    type: boolean
                    description: >
                      `true` significa que toda resposta sai de consulta ao banco,
                      é reproduzível e tem citação — nenhum modelo de linguagem no
                      caminho.
                  language_model_configured: { type: boolean }
                  language_model:
                    type: string
                    description: Modelo da camada 3. Presente só quando configurado.
                    example: claude-opus-5

  /clients/{cnpj}/assistant/usage:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [assistant]
      operationId: getAssistantUsage
      summary: Uso e limite mensal do assistente para este CNPJ
      description: >
        O limite vem do plano do **regime do cliente**, porque é por CNPJ ativo que
        o produto é cobrado. `allowance: 0` significa que o assistente não está
        incluído no plano — e nesse caso as rotas de conversa respondem `403`, não
        `429`: "não contratado" e "acabou o mês" são coisas diferentes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantUsage" }

  /clients/{cnpj}/assistant/threads:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [assistant]
      operationId: listAssistantThreads
      summary: Conversas anteriores com o assistente para este CNPJ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [threads, total]
                properties:
                  threads:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantThread" }
                  total: { type: integer }
    post:
      tags: [assistant]
      operationId: createAssistantThread
      summary: Abre uma conversa
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Conversa aberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantThread" }
        "403":
          description: Assistente não incluído no plano deste CNPJ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clients/{cnpj}/assistant/threads/{thread_id}/messages:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [assistant]
      operationId: listAssistantMessages
      summary: Mensagens da conversa, em ordem
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, total]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantMessage" }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [assistant]
      operationId: askAssistant
      summary: Pergunta ao assistente (somente leitura; nunca grava evento fiscal)
      description: |
        O serviço do assistente **não recebe o orquestrador**: não existe caminho
        de código daqui até o log fiscal. "Não escreve evento" é uma dependência
        ausente, não uma regra a ser respeitada.

        Toda afirmação de `kind: fact` traz ao menos uma citação, e a citação é
        conferida contra as evidências que a consulta de fato trouxe **antes** da
        resposta sair do serviço. Citação inventada é recusada mecanicamente,
        inclusive se vier de um modelo de linguagem.

        Afirmação de `kind: explanation` é texto normativo e não cita dado — e por
        isso não pode conter valor monetário nem competência, o que seria
        contrabandear fato para fora da regra de citação.

        Ação recomendada vem em `suggested`, com rota e corpo prontos. Quem
        executa é o usuário.

        `answerable: false` é resposta de primeira classe, com
        `unanswerableReason` obrigatório: "não sei, e por quê" é verdadeiro,
        enquanto uma resposta plausível sem lastro é o modo de falha que este
        produto não pode ter.

        A pergunta consome a cota mesmo quando a resposta sai como não
        respondível — perguntar consome trabalho de consulta, e não cobrar pelo
        "não sei" abriria caminho para contornar o limite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Resposta do assistente
          headers:
            X-Assistant-Remaining:
              description: Perguntas restantes no mês para este CNPJ.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [answer, usage]
                properties:
                  answer: { $ref: "#/components/schemas/AssistantAnswer" }
                  usage: { $ref: "#/components/schemas/AssistantUsage" }
        "403":
          description: Assistente não incluído no plano deste CNPJ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Limite mensal do plano atingido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      usage: { $ref: "#/components/schemas/AssistantUsage" }

  # -------------------------------------------------------------- events
  /clients/{cnpj}/events:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [events]
      summary: Event log do cliente (paginado por `event_seq`)
      parameters:
        - in: query
          name: after_seq
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: action
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  /clients/{cnpj}/events/summary:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [events]
      summary: Ações presentes no log deste CNPJ, com contagem
      description: |
        Alimenta o filtro da trilha com **apenas o que ocorreu**. Listar o
        vocabulário inteiro faria escolher um filtro que devolve vazio sem
        distinguir "não houve" de "errei o filtro".
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        count: { type: integer }
                        last_seq: { type: integer }
                        last_ts: { type: string, format: date-time }
                  total: { type: integer }

  /clients/{cnpj}/verify:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [events]
      summary: Re-executa replay e compara hash da projeção (INV-006)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stored_hash: { type: string }
                  replayed_hash: { type: string }
                  last_event_seq: { type: integer }

  /clients/{cnpj}/periods/{period}/proof:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [events]
      operationId: getPeriodProof
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, pdf], default: json }
      summary: Comprovante de integridade da competência
      description: >
        O documento que o escritório mostra ao cliente dele: qual número foi
        apurado, sobre quantos documentos, e a prova de que a trilha fecha.


        `?format=pdf` devolve o mesmo comprovante em PDF, para anexar a e-mail:
        o hash defendido (o da confirmação, ou o atual) vai **inteiro** no rodapé
        de cada página, e o SHA-256 do arquivo sai no cabeçalho `x-pdf-sha256`.
        Só leitura: gerar o PDF não grava evento.


        `confirmed_hash_reproduced` é a prova forte. O hash foi gravado no log no
        ato da confirmação, e reproduzi-lo exige replayar os eventos anteriores
        àquele instante — se alguém alterou, removeu ou acrescentou evento depois,
        o número não volta a bater. É `null` em competência ainda não confirmada.


        Um evento **removido** nem chega ao hash: o replayer detecta o buraco na
        sequência antes e responde `409 EVENT_STORE_CORRUPTED`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnpj: { type: string }
                  period: { type: string }
                  state: { type: string, enum: [open, assessed, reconciled, confirmed] }
                  verified_at: { type: string, format: date-time }
                  ok:
                    type: boolean
                    description: A projeção de agora fecha com o replay do log.
                  replayed_hash: { type: string }
                  stored_hash: { type: string }
                  confirmed_hash:
                    type: string
                    nullable: true
                    description: Hash aprovado no ato da confirmação; preservado após retificação.
                  confirmed_hash_reproduced:
                    type: boolean
                    nullable: true
                    description: O replay reproduz o hash da confirmação. `null` se não confirmada.
                  confirmed_at: { type: string, format: date-time, nullable: true }
                  confirmed_by: { type: string, nullable: true }
                  rectifies: { type: string, nullable: true }
                  rectified_by: { type: string, nullable: true }
                  last_event_seq: { type: integer }
                  events_in_period: { type: integer }
                  total_events: { type: integer }
                  documents:
                    type: object
                    properties:
                      inbound: { type: integer }
                      outbound: { type: integer }
                      total: { type: integer, description: Sem as canceladas. }
                      cancelled: { type: integer, description: "Canceladas na SEFAZ, fora das somas." }
            application/pdf:
              schema: { type: string, format: binary }
          headers:
            x-pdf-sha256:
              description: SHA-256 do PDF, só em `?format=pdf`.
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- billing
  /plans:
    get:
      tags: [billing]
      operationId: listPlans
      summary: Catálogo de planos, escada de volume e teto
      description: >
        **Pública.** Preço no site antes de qualquer contato comercial — o
        concorrente esconde preço atrás de formulário, e isso é posicionamento.


        A escada de faixas também é pública, pelo mesmo motivo: esconder o
        desconto de volume atrás de "fale com um consultor" seria a mesma
        opacidade que esconder o preço.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  minimum_cents: { type: integer }
                  minimum_formatted: { type: string }
                  cap_cents:
                    type: integer
                    nullable: true
                    description: Teto da assinatura. `null` quando não há teto contratado.
                  feature_labels:
                    type: object
                    description: >
                      Rótulo em PT-BR de cada chave que aparece em `plans[].features`,
                      com uma descrição de uma linha e a ordem de exibição. Existe para
                      a tela não traduzir `saude_cadastro` por conta própria — sem isto
                      quem constrói o frontend inventa o nome comercial.
                    additionalProperties:
                      type: object
                      properties:
                        label: { type: string }
                        description: { type: string, nullable: true }
                        sort_order: { type: integer }
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        from_clients: { type: integer }
                        discount_bps:
                          type: integer
                          maximum: 5000
                          description: >
                            Desconto **marginal**, como alíquota de IR: vale só para os
                            CNPJs dentro da faixa. O teto de 50% é condição de
                            monotonicidade — acima disso acrescentar um CNPJ caro
                            passaria a baixar a fatura.
                        label: { type: string, nullable: true }
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        regime: { type: string }
                        monthly_cents: { type: integer }
                        monthly_formatted: { type: string }
                        features: { type: array, items: { type: string } }
        "503":
          description: >
            Parâmetros de cobrança ausentes no banco (`billing_settings`). É
            configuração do servidor, não erro do cliente: 503 diz "tente
            depois" em vez de esconder a causa atrás de um 500 genérico.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [billing_not_configured] }
                  message: { type: string }

  /price-calculator:
    post:
      tags: [billing]
      operationId: calculatePrice
      summary: Calculadora pública de preço
      description: >
        Quantos CNPJs de cada regime, quanto custa.


        **`subtotal_cents` é bruto, não é o que se paga.** As quatro parcelas
        fecham por soma:
        `subtotal - volume_discount + cap_adjustment + minimum_adjustment = total`.
        Ignorar `volume_discount_cents` mostraria ao escritório uma fatura maior
        que a real.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clients]
              properties:
                clients:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    required: [regime, quantity]
                    properties:
                      regime: { type: string }
                      quantity: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceQuote" }
        "422": { $ref: "#/components/responses/Rejected" }

  # -------------------------------------------------------------- public
  /reform-readiness:
    post:
      tags: [public]
      operationId: reformReadiness
      summary: Diagnóstico de prontidão da carteira para a reforma
      description: >
        O visitante sobe XMLs e recebe o retrato de quantos dos seus fornecedores
        já emitem com o grupo UB da NT 2025.002 (IBS/CBS). **Sem criar conta.**


        Responde `200`, e não `207` como a ingestão: ali cada arquivo tem efeito
        individual no log; aqui nada é gravado, o relatório está completo mesmo
        com rejeições, e as rejeições são *dado do diagnóstico* — "2 dos seus 50
        XMLs nem abrem" —, não falha parcial.


        **Nenhum XML é guardado.** A métrica são contadores agregados, sem CNPJ,
        chave de acesso ou razão social. Com `REPORT_ENCRYPTION_KEY`, o resumo que
        a tela mostra fica cifrado até `persisted.summary_until` (24h), só para o
        envio por e-mail, e é apagado assim que sai. Com e-mail e `consent=true`
        no próprio upload, o relatório sai na hora (`email_sent`).


        Limites: 50 arquivos e 10 MB por lote; 3 diagnósticos por minuto e 20 por
        dia, por IP. Estourar responde `429` com `code: rate_limited` — que **não**
        é o mesmo `429` de limite de plano. Bifurque por `code`, nunca por status.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                email:
                  type: string
                  description: >
                    Opcional. O relatório sai de qualquer forma — muro de e-mail é a
                    opacidade que o produto combate. Só é gravado com `consent=true`.
                consent: { type: string, enum: ["true", "1"] }
                source: { type: string }
      responses:
        "200":
          description: Relatório de prontidão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessReport" }
        "400":
          description: >
            Entrada malformada: nenhum arquivo, mais de 50, ou lote acima de
            10 MB. A mensagem é a frase pronta para a tela — a superfície
            pública não usa o vocabulário de camada e motivo do pipeline
            fiscal, que não significa nada para um visitante anônimo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [bad_request] }
                  message: { type: string }
        "429":
          description: Limite de uso do diagnóstico público
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [rate_limited] }
                  message: { type: string }
                  retry_after_seconds: { type: integer }
        "503":
          description: Diagnóstico temporariamente desligado
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [diagnostic_disabled] }
                  message: { type: string }

  /reform-readiness/forget:
    get:
      tags: [public]
      operationId: forgetReadinessLead
      summary: Apaga o e-mail do diagnóstico (link do relatório enviado)
      description: >
        O link que vai no corpo do e-mail. Apaga e-mail, consentimento, origem e
        o que restar do resumo. Responde uma página HTML curta, porque quem abre
        é uma pessoa no navegador. O token só vale uma vez.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 20, maxLength: 100 }
      responses:
        "200": { description: E-mail apagado., content: { text/html: { schema: { type: string } } } }
        "404": { description: Link inválido ou já usado., content: { text/html: { schema: { type: string } } } }

  /reform-readiness/lead:
    post:
      tags: [public]
      operationId: registerReadinessLead
      summary: Anexa o e-mail a um diagnóstico já feito
      description: >
        A tela mostra o relatório **primeiro** e só então oferece enviá-lo por
        e-mail — muro de e-mail é a opacidade que o produto combate. Esta rota
        registra o endereço sem reprocessar o lote.


        O `report_id` vai no corpo, e não no caminho, porque o hook de
        autenticação reconhece rota pública por igualdade exata de URL.


        Responde `404` tanto para id inexistente quanto para diagnóstico que já
        tem lead: distinguir confirmaria a existência de um id a quem está
        chutando. Reenviar o formulário não troca o endereço nem a data de
        consentimento já gravados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id, email, consent]
              properties:
                report_id: { type: string, format: uuid }
                email: { type: string, maxLength: 254 }
                consent:
                  type: boolean
                  description: Precisa ser `true`. Sem consentimento não há base para guardar o endereço.
                source: { type: string, maxLength: 120 }
      responses:
        "200":
          description: >
            Lead registrado, e o relatório enviado em PDF quando o envio está
            configurado. `email_sent: false` não é erro da requisição: o lead
            ficou, e `email_not_sent_reason` diz por que o e-mail não saiu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead_registered: { type: boolean, enum: [true] }
                  email_sent: { type: boolean }
                  email_not_sent_reason:
                    type: string
                    enum: [mail_not_configured, report_not_available, send_failed]
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: >
            O resumo do diagnóstico não está mais guardado (24h). O lead não é
            gravado: a tela deve oferecer gerar o diagnóstico de novo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [report_expired] }
                  message: { type: string }
        "400":
          description: E-mail malformado ou consentimento ausente. Frase pronta para a tela.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [bad_request] }
                  message: { type: string }
        "429":
          description: Limite de uso
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [rate_limited] }
                  message: { type: string }
                  retry_after_seconds: { type: integer }

# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cnpj:
      in: path
      name: cnpj
      required: true
      # Doze posições alfanuméricas e dois dígitos verificadores numéricos: a
      # Receita emite CNPJ alfanumérico desde 31/07/2026 (IN RFB 2.229/2024).
      # O dígito verificador não é conferido pelo schema — JSON Schema não faz
      # módulo 11 —, e sim na fronteira de entrada da API.
      schema: { type: string, pattern: "^[0-9A-Za-z]{12}[0-9]{2}$" }
    Period:
      in: query
      name: period
      schema: { $ref: "#/components/schemas/PeriodId" }
    PeriodPath:
      in: path
      name: period
      required: true
      schema: { $ref: "#/components/schemas/PeriodId" }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: page_size
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Papel sem permissão, ou recurso não incluído no plano
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Rejected:
      description: Intenção rejeitada pelo pipeline (evento `output.rejected` gravado)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Rejection" }

  schemas:
    CapagStatement:
      type: object
      properties:
        statement_id: { type: string, format: uuid }
        extracted_at: { type: string, format: date-time }
        document_sha256: { type: string }
        document_kind: { type: string, enum: [pdf, html, text] }
        reference_date: { type: string, format: date, nullable: true }
        group: { type: string, nullable: true }
        values_cents: { type: object, additionalProperties: { type: integer } }
        printed_capag_cents: { type: integer, nullable: true }
        computed_capag_cents: { type: integer, nullable: true }
        total_debt_cents: { type: integer, nullable: true }
        printed_band: { type: string, nullable: true, enum: [A, B, C, D, null] }
        reproduces: { type: boolean }
        verified: { type: boolean }
        problems: { type: array, items: { type: string } }
        extraction: { type: object, description: "A extração com printed e quote de cada número." }
        model: { type: string }
    DfeAutoSync:
      type: object
      properties:
        enabled: { type: boolean }
        enabled_by: { type: string, format: uuid, nullable: true }
        enabled_at: { type: string, format: date-time, nullable: true }
    PriceQuote:
      type: object
      description: >
        Cotação da assinatura. É também o `snapshot` gravado na fatura: a prévia
        que a tela mostrou e a fatura emitida têm a mesma forma.


        **As quatro parcelas fecham por soma** e nenhum desconto entra escondido
        dentro do subtotal:
        `subtotal_cents - volume_discount_cents + cap_adjustment_cents + minimum_adjustment_cents = total_cents`.
      properties:
        snapshot_version:
          type: integer
          description: >
            2 desde a degressão por volume. Faturas emitidas antes não têm as
            parcelas novas — bifurque por este número, não pela presença dos campos.
        billable_clients: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              regime: { type: string }
              quantity: { type: integer }
              unit_cents: { type: integer, description: "Preço de tabela, sem desconto." }
              subtotal_cents: { type: integer, description: "`quantity × unit_cents`, BRUTO." }
              volume_discount_cents: { type: integer }
              tiers:
                type: array
                description: Decomposição por faixa. Ausente quando não há degressão.
                items:
                  type: object
                  properties:
                    from_clients: { type: integer }
                    to_clients: { type: integer, nullable: true }
                    label: { type: string, nullable: true }
                    quantity: { type: integer }
                    discount_bps: { type: integer }
                    gross_cents: { type: integer }
                    discount_cents: { type: integer }
                    net_cents: { type: integer }
        subtotal_cents: { type: integer, description: "Soma das linhas, BRUTA." }
        volume_discount_cents: { type: integer, minimum: 0 }
        cap_adjustment_cents: { type: integer, maximum: 0 }
        minimum_adjustment_cents: { type: integer, minimum: 0 }
        effective_discount_bps: { type: integer }
        total_cents: { type: integer }
        total_formatted: { type: string }
        minimum_cents: { type: integer }

    ReadinessRatio:
      type: object
      properties:
        total: { type: integer }
        ready: { type: integer }
        ready_pct:
          type: number
          description: >
            Percentual com uma casa, já calculado. Não refaça a conta na tela: ela
            divergiria do número que o próprio relatório afirma.

    ReadinessReport:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
          description: >
            Identifica este diagnóstico para o envio do relatório por e-mail em
            `POST /reform-readiness/lead`. Sem ele a tela precisaria reenviar os
            XMLs só para registrar o endereço.
        generated_at: { type: string, format: date-time }
        totals:
          type: object
          properties:
            documents: { type: integer }
            parsed: { type: integer }
            rejected: { type: integer }
            duplicates:
              type: integer
              description: XMLs repetidos no lote; não entram no denominador.
        documents_ready: { $ref: "#/components/schemas/ReadinessRatio" }
        items_ready: { $ref: "#/components/schemas/ReadinessRatio" }
        value_ready:
          type: object
          description: >
            Prontidão ponderada por valor. Costuma divergir bastante das outras
            duas — 10% dos documentos podem ser 80% do dinheiro, e é esse achado
            que mostra o tamanho do problema.
          properties:
            total_cents: { type: integer }
            ready_cents: { type: integer }
            ready_pct: { type: number }
        periods:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              documents: { $ref: "#/components/schemas/ReadinessRatio" }
        issuers:
          type: array
          description: Top 50 fornecedores por volume de documentos.
          items:
            type: object
            properties:
              cnpj: { type: string }
              name: { type: string }
              documents: { $ref: "#/components/schemas/ReadinessRatio" }
              total_cents: { type: integer }
        issuers_truncated: { type: boolean }
        ncms:
          type: array
          items:
            type: object
            properties:
              ncm: { type: string, description: "`(sem NCM)` agrupa itens sem classificação." }
              items: { $ref: "#/components/schemas/ReadinessRatio" }
        ncms_truncated: { type: boolean }
        rejections:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              layer: { type: integer, enum: [1, 2] }
              reason: { type: string }
              message: { type: string }
        limits:
          type: object
          properties:
            max_files: { type: integer }
            max_total_bytes: { type: integer }
        persisted:
          type: object
          description: O compromisso do produto dito na própria resposta.
          properties:
            documents: { type: boolean, enum: [false], description: Os XMLs nunca são guardados. }
            summary_until:
              type: string
              format: date-time
              nullable: true
              description: Até quando o resumo fica cifrado para o envio por e-mail. `null` quando nada foi guardado.
        lead_registered: { type: boolean }
        email_sent:
          type: boolean
          description: Só presente quando o upload trouxe e-mail com consentimento.
        email_not_sent_reason:
          type: string
          enum: [mail_not_configured, report_not_available, send_failed]

    PeriodId:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      example: "2027-01"

    Regime:
      type: string
      enum: [mei, simples_integrado, simples_hibrido, lucro_presumido, lucro_real]

    PeriodState:
      type: string
      enum: [open, assessed, reconciled, confirmed]

    CreditState:
      type: string
      enum: [expected, conditioned, released, at_risk, lost]

    RejectionReason:
      type: string
      enum:
        - schema_violation
        - unknown_code
        - code_incompatible
        - regime_violation
        - closed_period_violation
        - fisco_mismatch
        - duplicate_document
        - sequence_gap
        - verification_mismatch
        - boundary_violation

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Escritório Exemplo Contabilidade" }
        plan: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, accountant, viewer] }

    ClientCreate:
      type: object
      required: [cnpj, legal_name, regime]
      properties:
        cnpj: { type: string, pattern: "^[0-9A-Za-z]{12}[0-9]{2}$" }
        legal_name: { type: string }
        trade_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        uf: { type: string, minLength: 2, maxLength: 2 }
        municipality_ibge: { type: string, pattern: "^[0-9]{7}$" }
        cnae_primary: { type: string, example: "6201501" }

    ClientUpdate:
      type: object
      properties:
        trade_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        regime_effective_from: { $ref: "#/components/schemas/PeriodId" }

    Client:
      allOf:
        - $ref: "#/components/schemas/ClientCreate"
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            status: { type: string, enum: [active, inactive] }
            has_certificate:
              type: boolean
              description: |
                Vem do cofre, não do log. O log é append-only: "existe
                `certificate.stored`" continua verdadeiro depois de remover o
                certificado, e o cabeçalho afirmaria que há um guardado.
          # `current_period` saiu: nunca foi implementado, e as competências vêm
          # de `GET /clients/{cnpj}/periods`, que é a lista inteira com hash e
          # quem confirmou. Duas fontes para a mesma pergunta divergiriam.

    ClientSummary:
      type: object
      properties:
        cnpj: { type: string }
        legal_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        status: { type: string, enum: [active, inactive] }
        period: { $ref: "#/components/schemas/PeriodId" }
        state: { $ref: "#/components/schemas/PeriodState" }
        documents: { type: integer }
        open_issues: { type: integer }
        credit_at_risk_brl:
          type: number
          nullable: true
          description: |
            Sempre `null` nesta listagem. O estado do crédito é derivado na
            leitura, e derivá-lo por linha custaria uma classificação por
            cliente; `0` afirmaria "não tem crédito em risco". O número está em
            `GET /clients/{cnpj}/credits/at-risk`.
        next_deadline: { type: string, format: date, nullable: true }

    Period:
      type: object
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        state: { $ref: "#/components/schemas/PeriodState" }
        projection_hash: { type: string, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        confirmed_by: { type: string, nullable: true }

    DocumentSummary:
      type: object
      properties:
        access_key: { type: string }
        model: { type: string, enum: [nfe, nfce, nfse, cte] }
        direction: { type: string, enum: [inbound, outbound] }
        issued_at: { type: string, format: date-time }
        counterparty_cnpj: { type: string }
        counterparty_name: { type: string }
        total_brl: { type: number }
        issues: { type: integer }
        credit_state: { $ref: "#/components/schemas/CreditState" }

    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/DocumentItem" }
            issues:
              type: array
              items: { $ref: "#/components/schemas/Issue" }
            event_seq: { type: integer }

    DocumentItem:
      type: object
      description: Um item da nota com tributos atuais e IBS/CBS lado a lado
      properties:
        line: { type: integer }
        item_id: { type: string, description: Vínculo com o cadastro }
        description: { type: string }
        ncm: { type: string }
        nbs: { type: string, nullable: true }
        cfop: { type: string }
        quantity: { type: number }
        unit_price_brl: { type: number }
        legacy:
          type: object
          description: Tributos atuais destacados
          properties:
            icms: { $ref: "#/components/schemas/TaxLine" }
            ipi: { $ref: "#/components/schemas/TaxLine" }
            pis: { $ref: "#/components/schemas/TaxLine" }
            cofins: { $ref: "#/components/schemas/TaxLine" }
            iss: { $ref: "#/components/schemas/TaxLine" }
        reform:
          type: object
          description: Grupo UB (IBS/CBS) destacado
          properties:
            cst: { type: string, example: "000" }
            cclasstrib: { type: string, example: "000001" }
            ibs_uf: { $ref: "#/components/schemas/TaxLine" }
            ibs_mun: { $ref: "#/components/schemas/TaxLine" }
            cbs: { $ref: "#/components/schemas/TaxLine" }
        expected_reform:
          type: object
          description: O que o motor de regras esperava (para exibir divergência)
          properties:
            cst: { type: string }
            cclasstrib: { type: string }
            cbs_rate: { type: number }
            ibs_rate: { type: number }

    TaxLine:
      type: object
      properties:
        cst: { type: string, nullable: true }
        base_brl: { type: number }
        rate: { type: number }
        amount_brl: { type: number }

    Issue:
      type: object
      properties:
        id: { type: string }
        layer:
          type: integer
          minimum: 1
          maximum: 7
          description: Camada do pipeline que detectou (1 parse … 7 verification-gate)
        reason: { $ref: "#/components/schemas/RejectionReason" }
        severity: { type: string, enum: [low, medium, high, critical] }
        message: { type: string, description: Texto em PT-BR para o contador }
        line: { type: integer, nullable: true }
        suggested_fix: { type: string, nullable: true }

    Item:
      type: object
      properties:
        item_id: { type: string }
        description: { type: string }
        ncm: { type: string }
        nbs: { type: string, nullable: true }
        classification: { $ref: "#/components/schemas/Classification" }
        health: { type: string, enum: [ok, warning, error] }
        never_classified:
          type: boolean
          description: |
            Nunca classificado. `health` vem `warning` para estes, que é o mais
            próximo dos três valores — sem este booleano a tela não distingue
            "aviso" de "nem começou", e a diferença decide o que fazer com a
            linha.
        effective_from:
          type: string
          nullable: true
          description: Vigência da classificação vigente. `null` se nunca classificado.
        health_reasons:
          type: array
          items: { type: string }
        documents_affected: { type: integer }
        last_seen_at: { type: string, format: date-time }

    Classification:
      type: object
      required: [effective_from]
      properties:
        effective_from: { $ref: "#/components/schemas/PeriodId" }
        cst_ibs_cbs: { type: string }
        cclasstrib: { type: string }
        cst_icms: { type: string, nullable: true }
        cst_pis_cofins: { type: string, nullable: true }
        cfop_default: { type: string, nullable: true }
        justification: { type: string }

    CatalogHealth:
      type: object
      properties:
        items_total: { type: integer }
        ok: { type: integer }
        warning:
          type: integer
          description: Classificados, com pendência. **Não** inclui os nunca classificados.
        error: { type: integer }
        never_classified:
          type: integer
          description: |
            Itens que nunca foram classificados. Ficava somado a `warning`, e são
            coisas diferentes: aviso é trabalho feito com pendência, nunca
            classificado é trabalho que não começou. `ok + warning + error +
            never_classified` fecha em `items_total`.
        not_verified:
          type: integer
          description: |
            Itens que não puderam ser verificados por falta das tabelas oficiais.
            Campo próprio para não se confundir com "está tudo certo".
        reference_tables_loaded:
          type: boolean
          description: |
            `true` só quando **tudo** que a validação precisa está carregado.
            Tudo-ou-nada de propósito: é a resposta para "ausência de erro
            significa correto?", e essa resposta é sim ou não. Um tipo carregado
            não autoriza o sim, porque o item pode estar errado justamente no
            tipo que ninguém verificou.
        reference_tables:
          type: object
          additionalProperties: { type: integer }
          description: |
            Quantos códigos há por tipo — `ncm`, `nbs`, `cfop`, `cst_icms`,
            `cst_pis_cofins`, `cst_ibs_cbs`, `cclasstrib` — e quantos pares em
            `cclasstrib_cst_pares`. Zero num tipo é o que sustenta o
            `not_verified` daquele tipo, **e só daquele**: a validação é por
            tipo, e a tela deve dizer o que foi e o que não foi conferido em vez
            de um aviso único.
        notice:
          type: string
          description: |
            Presente somente quando `reference_tables_loaded` é `false`. A tela
            deve exibi-lo com destaque: sem as tabelas, "nenhum erro" não
            significa "correto".
        inbound_documents_affected: { type: integer }
        amount_at_stake_cents: { type: integer }
        outbound_documents_affected: { type: integer }
        top_reasons:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              count: { type: integer }

    Assessment:
      type: object
      description: |
        Apuração de uma competência, como `GET /clients/{cnpj}/assessments/{period}`
        devolve. Valores em **centavos**, inteiros — nunca reais em ponto
        flutuante, porque um centavo de arredondamento numa apuração é uma
        divergência com o Fisco.
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        regime: { $ref: "#/components/schemas/Regime" }
        totals:
          type: object
          description: |
            Um `TaxTotals` por tributo, num mapa plano. As chaves atuais são
            `icms`, `ipi`, `pis`, `cofins` (sistema atual) e `ibs_uf`,
            `ibs_mun`, `cbs` (reforma).
          additionalProperties: { $ref: "#/components/schemas/TaxTotals" }
        total_due_cents:
          type: integer
          nullable: true
          description: |
            Soma dos `dueCents`. **`null` quando qualquer tributo não é
            determinável** — somar tratando o indeterminável como zero daria um
            total que parece calculado e não é.
        not_computable:
          type: array
          description: "O que não foi possível calcular, e por quê. Ver NotComputable."
          items: { $ref: "#/components/schemas/NotComputable" }
        coverage:
          type: object
          description: "Prontidão para a reforma: itens que já trazem o grupo IBS/CBS."
          properties:
            itemsWithReformGroup: { type: integer }
            itemsTotal: { type: integer }
        documents_count: { type: integer }
        items_count: { type: integer }
        projection_hash:
          type: string
          description: |
            Hash da projeção **no momento em que esta apuração foi calculada** —
            não o hash atual do log.
        is_current:
          type: boolean
          description: |
            O `projection_hash` acima ainda é o hash atual do log. Qualquer
            evento posterior (um ajuste, um documento novo) o torna `false`, e
            então `POST .../confirm` com esse hash é recusado com
            `verification_mismatch`, corretamente. A tela deve exigir nova
            projeção e revisão em vez de tentar confirmar.

            A resposta **não** devolve o hash atual, de propósito: entregá-lo
            convidaria a tela a reenviá-lo, que é exatamente o que anularia a
            proteção.
        event_seq: { type: integer }
        computed_at: { type: string, format: date-time }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/Adjustment" }

    TaxTotals:
      type: object
      description: |
        Quatro números diferentes, e a tela **não deve colapsá-los em um
        "total"**: os dois primeiros saem dos documentos e são certos; os dois
        últimos dependem de norma publicada.
      properties:
        debitsCents:
          type: integer
          description: "Tributo destacado nas saídas. Sempre calculável."
        potentialCreditsCents:
          type: integer
          description: "Tributo destacado nas entradas, antes do juízo de creditamento."
        creditableCents:
          type: integer
          nullable: true
          description: |
            Crédito aproveitável. **`null` quando a regra de creditamento não
            está publicada** para o regime e a competência — ausência de regra
            significa "não sei", não "não credita".
        dueCents:
          type: integer
          nullable: true
          description: |
            `debitsCents - creditableCents`. `null` quando o crédito não é
            determinável. Renderizar como *"não determinável"* com o motivo de
            `not_computable` ao lado: um `—` sem explicação parece defeito, e um
            `0` seria mentira.
        ruleId:
          type: string
          description: "Regra aplicada, para a memória de cálculo."

    NotComputable:
      type: object
      description: |
        Por que um tributo ou item não pôde ser calculado. É o que sustenta o
        `null` em `dueCents` — sem isso, o `null` seria só um vazio.
      properties:
        scope: { type: string, enum: [tributo, item] }
        subject: { type: string, description: "O tributo ou o código do item" }
        reason:
          type: string
          enum: [rule_not_published, missing_reform_group]
          description: |
            `rule_not_published`: nenhuma regra de creditamento vigente para o
            regime e a competência. `missing_reform_group`: o item não traz o
            grupo IBS/CBS, o que é o esperado em documento de 2025.
        message: { type: string, description: "Explicação em PT-BR, pronta para exibir." }

    Adjustment:
      type: object
      required: [tax, amount_cents, reason]
      description: |
        Ajuste manual justificado. **Não sobrescreve a apuração**: entra como
        linha própria, e a diferença entre o apurado e o ajustado é informação.
      properties:
        id: { type: string, readOnly: true }
        tax:
          type: string
          enum: [icms, ipi, pis, cofins, ibs_uf, ibs_mun, cbs]
        amount_cents:
          type: integer
          description: "Positivo aumenta o débito; negativo reduz."
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: "Obrigatória. Vai para o event log junto do ajuste."
        reference_access_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time, readOnly: true }

    PaymentMatch:
      type: object
      required: [accessKey, fitid, confidence, rationale]
      description: >
        Todo casamento é HIPÓTESE. Valor e data iguais não provam que aquele
        pagamento é daquela nota, e casar errado reportaria crédito liberado que
        não está.
      properties:
        accessKey: { type: string }
        fitid: { type: string, description: "Identificador do lançamento no extrato." }
        confidence:
          type: string
          enum: [exact, amount_and_date, amount_only, ambiguous]
          description: >
            `exact` = a chave ou o número da nota aparece no histórico do
            lançamento. `amount_and_date` = hipótese forte. `amount_only` =
            hipótese fraca, data fora da janela. `ambiguous` = mais de um
            candidato, e o sistema **não escolhe**.
        rationale: { type: string, description: "Por que o casamento foi feito. É o que o contador confere." }
        candidates:
          type: array
          items: { type: string }
          description: Só no ambíguo — as chaves candidatas, para a decisão humana.

    StatementImportOutcome:
      type: object
      required:
        [statement_id, source, reference, lines_imported, lines_duplicated,
         rejected, matches, ambiguous, event_seq, projection_hash]
      properties:
        statement_id: { type: string, format: uuid }
        source: { type: string, enum: [ofx, csv] }
        reference: { type: string }
        account: { type: string, nullable: true }
        period_from: { type: string, format: date, nullable: true }
        period_to: { type: string, format: date, nullable: true }
        lines_imported: { type: integer }
        lines_duplicated:
          type: integer
          description: "Linhas que já existiam pelo FITID. Reimportar não dobra o pagamento."
        rejected:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              content: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/PaymentMatch" }
        ambiguous: { type: integer }
        event_seq: { type: integer }
        projection_hash: { type: string }

    CreditPosition:
      type: object
      required: [accessKey, period, tax, supplierCnpj, amountCents, state, reason, hasReformGroup]
      properties:
        accessKey: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        tax: { type: string }
        supplierCnpj: { type: string }
        supplierName: { type: string, nullable: true }
        amountCents: { type: integer }
        hasReformGroup: { type: boolean }
        state:
          type: string
          enum: [expected, conditioned, released, at_risk, lost]
          description: >
            `expected` = não depende de liquidação (tributo do sistema antigo, ou
            documento sem grupo UB). `conditioned` = depende da extinção da etapa
            anterior. `at_risk` = condicionado e sem pagamento identificado há
            tempo. `released` exige evidência de extinção, que não tem fonte hoje.
            `lost` **nunca** é derivado: declarar crédito perdido é decisão do
            contador, com consequência contábil.
        reason: { type: string, description: "Por que está neste estado. Nunca vazio." }
        unpaidDays: { type: integer, nullable: true }

    SupplierCreditRisk:
      type: object
      required:
        [supplierCnpj, documents, creditExpectedCents, creditConditionedCents,
         creditReleasedCents, creditAtRiskCents, emitsReformGroup]
      properties:
        supplierCnpj: { type: string }
        supplierName: { type: string, nullable: true }
        documents: { type: integer }
        creditExpectedCents: { type: integer }
        creditConditionedCents: { type: integer }
        creditReleasedCents: { type: integer }
        creditAtRiskCents: { type: integer }
        oldestUnpaidDays: { type: integer, nullable: true }
        emitsReformGroup:
          type: boolean
          description: >
            Se ALGUM documento deste fornecedor traz o grupo IBS/CBS. Não se chama
            `uses_split_payment`, embora seja esse o nome no briefing: o sistema
            observa o que está no XML, não se o fornecedor usa split payment.

    CreditRiskReport:
      type: object
      required: [statements_imported, suppliers, positions, totals]
      properties:
        period: { type: string, nullable: true }
        statements_imported:
          type: boolean
          description: "`false` = nenhum extrato importado; todo crédito aparece condicionado."
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/SupplierCreditRisk" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/CreditPosition" }
        totals:
          type: object
          properties:
            expectedCents: { type: integer }
            conditionedCents: { type: integer }
            releasedCents: { type: integer }
            atRiskCents: { type: integer }

    Deadline:
      type: object
      required: [cnpj, kind, name, due_date, days_left, severity, nature, state]
      properties:
        cnpj: { type: string }
        legal_name: { type: string, nullable: true }
        regime: { $ref: "#/components/schemas/Regime" }
        period: { type: string, nullable: true }
        kind: { type: string, example: certificado_a1_vencendo }
        name: { type: string }
        due_date: { type: string, format: date }
        days_left: { type: integer, description: "Negativo quando o prazo já venceu." }
        severity: { type: string, enum: [low, medium, high, critical] }
        nature:
          type: string
          enum: [normativo, fato]
          description: >
            `normativo` é prazo de norma e sempre traz `legal_basis`. `fato` é data
            que o sistema conhece — a validade de um certificado A1, por exemplo —
            e não tem base legal porque não é prazo de lei.
        legal_basis: { type: string, nullable: true }
        state: { type: string, enum: [pending, met, missed, dismissed] }

    Pendency:
      type: object
      required: [kind, cnpj, period, name, message, severity, openSince, daysOpen]
      properties:
        kind:
          type: string
          enum:
            - competencia_nao_apurada
            - apuracao_nao_confirmada
            - proposta_do_fisco_sem_resposta
            - proposta_do_fisco_sem_detalhe
        cnpj: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        name: { type: string }
        message: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        openSince:
          type: string
          format: date-time
          description: Substitui a data de vencimento, que para uma pendência não existe.
        daysOpen: { type: integer }

    PortfolioCalendar:
      type: object
      required: [horizon_days, normative_rules_loaded, deadlines, pendencies]
      properties:
        horizon_days: { type: integer }
        normative_rules_loaded: { type: boolean }
        deadlines:
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        pendencies:
          type: array
          items: { $ref: "#/components/schemas/Pendency" }

    Divergence:
      type: object
      required:
        [scope, subject, tax, ourCents, fiscoCents, differenceCents, probableCause, severity]
      properties:
        scope: { type: string, enum: [tributo, documento, item] }
        subject:
          type: string
          description: Chave de acesso, `chave#item` ou o nome do tributo.
        tax: { type: string }
        direction: { type: string, enum: [inbound, outbound], nullable: true }
        accessKey: { type: string, nullable: true }
        line: { type: integer, nullable: true }
        ourCents: { type: integer }
        fiscoCents: { type: integer }
        differenceCents:
          type: integer
          description: Fisco menos nosso. Positivo = o Fisco aponta mais do que escrituramos.
        probableCause:
          type: string
          description: >
            Hipótese, não diagnóstico: o sistema vê duas listas de números, e a
            razão real pode ser erro nosso, erro do Fisco, documento cancelado ou
            nota ainda não processada por um dos lados.
          enum:
            - aliquota_divergente
            - base_divergente
            - base_e_aliquota_divergentes
            - valor_incoerente_com_base_e_aliquota
            - debito_nao_escriturado
            - credito_nao_aproveitado
            - debito_nao_reconhecido_pelo_fisco
            - credito_glosado
            - arredondamento
            - total_nao_explicado_pelas_linhas
            - causa_nao_determinada
        severity: { type: string, enum: [low, medium, high, critical] }

    ComparisonSummary:
      type: object
      required:
        [divergencesCount, exposureCents, creditLossCents, creditAtRiskCents,
         bySeverity, linesCompared, lineLevel]
      properties:
        divergencesCount:
          type: integer
          description: Total exato, mesmo quando a lista de itens vem cortada em 500.
        exposureCents:
          type: integer
          description: Débito que o Fisco aponta e não escrituramos. Será cobrado.
        creditLossCents:
          type: integer
          description: Crédito que o Fisco reconhece e não aproveitamos. Dinheiro na mesa.
        creditAtRiskCents:
          type: integer
          description: Crédito nosso que o Fisco não reconhece. Tende a ser glosado.
        bySeverity:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
        linesCompared: { type: integer, description: "Zero quando a proposta veio só com totais." }
        lineLevel: { type: boolean }

    FiscoComparison:
      type: object
      required:
        [period, source, reference, line_level, lines_count, totals,
         uploaded_at, event_seq, divergences, summary]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        source: { type: string, enum: [manual_upload, official_api] }
        reference:
          type: string
          description: >
            Nome do arquivo ou protocolo. É o que permite ao contador dizer depois
            qual proposta recebeu e quando.
        line_level: { type: boolean }
        lines_count: { type: integer }
        totals:
          type: object
          additionalProperties: { type: integer }
        uploaded_at: { type: string, format: date-time }
        event_seq: { type: integer }
        divergences:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Divergence" }
        summary: { $ref: "#/components/schemas/ComparisonSummary" }

    FiscoComparisonOutcome:
      allOf:
        - $ref: "#/components/schemas/FiscoComparison"
        - type: object
          properties:
            projection_hash: { type: string }
            rejected:
              type: array
              description: Linhas do CSV recusadas. Uma linha ruim não derruba as boas.
              items:
                type: object
                properties:
                  row: { type: integer, description: "Número da linha, contando o cabeçalho como 1." }
                  reason: { type: string }
                  content: { type: string }

    SimulationRequest:
      type: object
      required: [scenario, base_from, base_to]
      properties:
        scenario: { type: string, enum: [transition_2027_2028, full_2033] }
        base_from: { $ref: "#/components/schemas/PeriodId" }
        base_to: { $ref: "#/components/schemas/PeriodId" }
        overrides:
          type: object
          description: >
            Premissas editáveis. Cada uma informada aqui aparece no relatório com
            `origin: provided` — inclusive `b2b_share`, que por omissão é medida
            nas notas.
          properties:
            ibs_cbs_rate: { type: number, minimum: 0, maximum: 100 }
            simples_effective_rate: { type: number, minimum: 0, maximum: 100 }
            creditable_share: { type: number, minimum: 0, maximum: 1 }
            presumed_profit_rate: { type: number, minimum: 0, maximum: 100 }
            tax_lag_days_current: { type: integer, minimum: 0, maximum: 365 }
            b2b_share: { type: number, minimum: 0, maximum: 1 }

    SimulationAssumption:
      type: object
      required: [key, label, value, unit, origin, source]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [percent, brl, days, ratio] }
        origin:
          type: string
          enum: [published, measured, provided]
          description: >
            `published` = regra em `tax_rules`, com a fonte normativa.
            `measured` = medido nos documentos do cliente. `provided` = premissa
            de quem simulou. É o campo que separa cálculo de estimativa.
        source: { type: string, description: "Nunca vazio." }

    SimulationOutcome:
      type: object
      required:
        [regime, directTaxMonthlyCents, creditToB2BCustomersCents,
         economicCostMonthlyCents, workingCapitalExposureCents, breakdown]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        directTaxMonthlyCents:
          type: integer
          description: O que sai do caixa por mês — a guia.
        creditToB2BCustomersCents:
          type: integer
          description: >
            Crédito que o cliente PJ pode aproveitar. **Não reduz a guia**: é
            vantagem competitiva, e sem ele o cliente PJ exige desconto
            equivalente.
        economicCostMonthlyCents:
          type: integer
          description: >
            Guia mais o desconto que o cliente PJ vai exigir por não ter
            crédito. É o número que compara regimes de verdade.
        workingCapitalExposureCents:
          type: integer
          description: >
            Capital de giro exigido pelo adiantamento do tributo. Sob split
            payment o tributo sai na liquidação, e não no vencimento da guia — a
            carga anual pode ser igual e o caixa, não.
        breakdown:
          type: object
          additionalProperties: { type: integer }

    SimulationResult:
      type: object
      required:
        [scenario, base, outcomes, winner, robustness, annualSavingVsWorstCents,
         sensitivity, assumptions, notModeled]
      properties:
        scenario: { type: string }
        base:
          type: object
          description: Medido nos documentos; devolvido junto para conferência.
          properties:
            monthlyRevenueCents: { type: integer }
            monthlyInputsCents: { type: integer }
            b2bShare: { type: number }
            documentsConsidered: { type: integer }
            monthsConsidered: { type: integer }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/SimulationOutcome" }
        winner:
          type: string
          nullable: true
          # Só os regimes comparáveis: MEI e Lucro Real não entram na simulação.
          enum: [simples_integrado, simples_hibrido, lucro_presumido]
          description: >
            `null` quando o vencedor muda dentro da faixa de alíquotas explorada.
            `null` aqui é resposta, e não ausência de resposta: apontar um
            vencedor que depende de alíquota não publicada seria dar recomendação
            com cara de cálculo.
        robustness:
          type: string
          enum: [robust, sensitive]
          description: "`sensitive` anda sempre junto de `winner: null`."
        annualSavingVsWorstCents: { type: integer }
        b2bBreakevenShare:
          type: number
          nullable: true
          description: >
            Fração de receita contra PJ em que o vencedor troca. É o número que o
            contador leva para a conversa. `null` quando o mesmo regime vence de
            0 a 100%.
        sensitivity:
          type: array
          description: Mapa alíquota × fração de crédito → regime vencedor.
          items:
            type: object
            properties:
              ibsCbsRate: { type: number }
              creditableShare: { type: number }
              winner: { $ref: "#/components/schemas/Regime" }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/SimulationAssumption" }
        notModeled:
          type: array
          items: { type: string }

    StoredSimulation:
      type: object
      required: [id, scenario, base_from, base_to, winner, robustness, simulated_at, result]
      properties:
        id: { type: string, format: uuid }
        scenario: { type: string }
        base_from: { $ref: "#/components/schemas/PeriodId" }
        base_to: { $ref: "#/components/schemas/PeriodId" }
        winner:
          type: string
          nullable: true
          enum: [simples_integrado, simples_hibrido, lucro_presumido]
        robustness: { type: string, enum: [robust, sensitive] }
        simulated_at: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/SimulationResult" }

    AuditTrailDefinition:
      type: object
      required: [trailId, name, description, layer, defaultSeverity, taxScope, source, matches]
      properties:
        trailId: { type: string, example: "cclasstrib_vs_cst" }
        name: { type: string, example: "cClassTrib incompatível com CST-IBS/CBS" }
        description: { type: string }
        layer:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: Camada do pipeline que detecta a trilha; `null` quando não vem de uma camada.
        defaultSeverity: { type: string, enum: [low, medium, high, critical] }
        taxScope:
          type: string
          enum: [legacy, reform, both, none]
          description: Sistema tributário a que a trilha se refere.
        source:
          type: string
          enum: [output_rejected, item_classification, assessment, period_state]
          description: Onde a trilha busca as inconsistências que agrupa.
        matches:
          type: array
          items: { type: string }
          description: Motivos (ou estados de competência) que a trilha reconhece.

    AuditTrailIssue:
      type: object
      required: [subject, message, severity]
      properties:
        subject:
          type: string
          description: Chave de acesso, id de item, tributo ou nome de arquivo.
        message: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        layer: { type: integer, minimum: 1, maximum: 7 }
        documentsAffected: { type: integer }
        amountAtStakeCents: { type: integer }

    AuditTrailResult:
      type: object
      required:
        [trailId, name, description, layer, severity, taxScope, status,
         issuesCount, amountAtStakeCents, documentsAffected, issues]
      properties:
        trailId: { type: string }
        name: { type: string }
        description: { type: string }
        layer: { type: integer, nullable: true }
        severity: { type: string, enum: [low, medium, high, critical] }
        taxScope: { type: string, enum: [legacy, reform, both, none] }
        status:
          type: string
          enum: [passed, warning, failed, not_applicable]
          description: >
            `not_applicable` significa **não conferido** — a tabela oficial de
            códigos não estava carregada. Não é equivalente a `passed`.
        issuesCount:
          type: integer
          description: Total exato de ocorrências, mesmo quando `issues` vem amostrado.
        amountAtStakeCents: { type: integer }
        documentsAffected: { type: integer }
        issues:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AuditTrailIssue" }
          description: Amostra de até 25 ocorrências; o total está em `issuesCount`.

    AuditTrailsSummary:
      type: object
      required: [passed, warning, failed, not_applicable, amountAtStakeCents]
      properties:
        passed: { type: integer }
        warning: { type: integer }
        failed: { type: integer }
        not_applicable: { type: integer }
        amountAtStakeCents: { type: integer }

    AuditTrailReport:
      type: object
      required:
        [period, period_state, projection_hash, reference_tables_loaded, trails, summary]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        period_state: { type: string, enum: [open, assessed, reconciled, confirmed] }
        projection_hash: { type: string }
        reference_tables_loaded:
          type: boolean
          description: >
            `false` significa que as trilhas de código não conferiram nada, e as
            que dependem delas vêm como `not_applicable`.
        trails:
          type: array
          items: { $ref: "#/components/schemas/AuditTrailResult" }
        summary: { $ref: "#/components/schemas/AuditTrailsSummary" }

    Book:
      type: object
      required:
        [id, period, audience, white_label, include_trace, projection_hash,
         trails_summary, pages, pdf_bytes, pdf_sha256, event_seq, generated_at]
      properties:
        id: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/PeriodId" }
        audience: { type: string, enum: [accountant, business_owner] }
        white_label: { type: boolean }
        include_trace: { type: boolean }
        projection_hash:
          type: string
          description: Hash da projeção no instante da geração; impresso no rodapé de toda página.
        trails_summary: { $ref: "#/components/schemas/AuditTrailsSummary" }
        pages: { type: integer }
        pdf_bytes: { type: integer }
        pdf_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 do arquivo, devolvido também no cabeçalho `X-Book-SHA256`.
        event_seq: { type: integer, description: Seq do `book.generated` no log. }
        generated_at: { type: string, format: date-time }

    CertificateInfo:
      type: object
      properties:
        cnpj: { type: string }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        days_to_expiry: { type: integer }
        stored_at: { type: string, format: date-time }
        stored_by: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        usage_count:
          type: integer
          description: |
            Usos desde que **este** certificado foi guardado. Zera quando um novo
            PFX substitui o anterior. O campo se chamava `usage_count_30d` e
            contava tudo — não havia janela de 30 dias em lugar nenhum.

    CertificateUsage:
      type: object
      description: Projeção de um evento `certificate.used`
      properties:
        event_seq: { type: integer }
        used_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, agent, system] }
            id: { type: string }
        purpose:
          type: string
          enum: [dfe_distribution, nfse_query, manifestation, sped_transmission, other]
        target: { type: string, description: Serviço/URL acessado }
        outcome: { type: string, enum: [success, failure] }
        ip: { type: string, nullable: true }

    AssistantUsage:
      type: object
      required: [used, allowance, remaining]
      properties:
        used: { type: integer }
        allowance:
          type: integer
          description: "Zero significa que o assistente não está incluído no plano do regime."
        remaining: { type: integer }

    AssistantThread:
      type: object
      required: [id, cnpj, title, created_at, messages_count]
      properties:
        id: { type: string, format: uuid }
        cnpj: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        messages_count: { type: integer }

    AssistantCitation:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [event, document, assessment_line, divergence, item, period]
        eventSeq:
          type: integer
          nullable: true
          description: Posição no log deste CNPJ. Conferível pelo `POST /verify`.
        accessKey: { type: string, nullable: true }
        line: { type: integer, nullable: true }
        tax: { type: string, nullable: true }
        itemId: { type: string, nullable: true }
        period: { type: string, nullable: true }
        label: { type: string, description: "Rótulo curto para a tela; nunca substitui os campos acima." }

    AssistantClaim:
      type: object
      required: [kind, text, citations]
      properties:
        kind:
          type: string
          enum: [fact, explanation]
          description: >
            `fact` afirma algo sobre os dados deste CNPJ e sempre traz citação.
            `explanation` é texto normativo, não cita dado, e não pode conter
            valor monetário nem competência.
        text: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/AssistantCitation" }

    AssistantSuggestedIntention:
      type: object
      required: [action, method, endpoint, rationale]
      description: Ação que o usuário pode executar. O assistente nunca a executa.
      properties:
        action: { type: string, example: "assessment.projected" }
        method: { type: string, enum: [GET, POST] }
        endpoint: { type: string, example: "/v1/clients/{cnpj}/assessments/2027-09" }
        payload: { type: object }
        rationale: { type: string }

    AssistantAnswer:
      type: object
      required: [intent, tier, confidence, answerable, claims, suggested]
      properties:
        intent: { type: string, example: valor_devido }
        tier:
          type: integer
          enum: [1, 3]
          description: >
            1 = consulta determinística, reproduzível, sem modelo nenhum.
            3 = modelo de linguagem compondo a resposta sobre os fatos da camada
            1: cada afirmação cita as mesmas evidências, e valor em R$ ou
            competência que não esteja na evidência citada derruba a resposta.
            Sai com `confidence: medium`. A camada 2
            do ADR-026 é classificação de item em lote, trabalho do catálogo e
            não de conversa.
        confidence: { type: string, enum: [high, medium, low] }
        answerable: { type: boolean }
        unanswerableReason:
          type: string
          nullable: true
          description: Obrigatório quando `answerable` é `false`.
        claims:
          type: array
          items: { $ref: "#/components/schemas/AssistantClaim" }
        suggested:
          type: array
          items: { $ref: "#/components/schemas/AssistantSuggestedIntention" }

    AssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content:
          type: string
          description: A resposta lida de cima a baixo; as afirmações citadas estão em `claims`.
        intent: { type: string, nullable: true }
        tier: { type: integer, nullable: true }
        confidence: { type: string, enum: [high, medium, low], nullable: true }
        answerable: { type: boolean, nullable: true }
        claims:
          type: array
          items: { $ref: "#/components/schemas/AssistantClaim" }
        suggested:
          type: array
          items: { $ref: "#/components/schemas/AssistantSuggestedIntention" }
        created_at: { type: string, format: date-time }

    SpedImportOutcome:
      type: object
      required:
        [sped_file_id, period, kind, layout_version, documents_count,
         carried_credits_count, rejected, counts, event_seq, projection_hash]
      properties:
        sped_file_id: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/PeriodId" }
        kind: { type: string, enum: [original, retificadora] }
        layout_version: { type: string }
        company_name: { type: string }
        documents_count: { type: integer }
        carried_credits_count: { type: integer }
        rejected:
          type: array
          description: Registros recusados, com a linha e o motivo. Um ruim não derruba os bons.
          items:
            type: object
            properties:
              line: { type: integer }
              record: { type: string }
              reason: { type: string }
        counts:
          type: object
          description: Registros lidos por tipo, para conferir o que entrou.
          additionalProperties: { type: integer }
        event_seq: { type: integer }
        projection_hash: { type: string }

    EfdIcmsImportOutcome:
      type: object
      required:
        [sped_file_id, period, kind, layout_version, uf, documents_count,
         has_icms_assessment, has_ipi_assessment, rejected, counts, event_seq,
         projection_hash]
      properties:
        sped_file_id: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/PeriodId" }
        kind: { type: string, enum: [original, retificadora] }
        layout_version: { type: string }
        company_name: { type: string }
        uf:
          type: string
          description: A EFD ICMS/IPI é estadual; sem a UF não se sabe qual legislação aplicar.
        documents_count: { type: integer }
        has_icms_assessment:
          type: boolean
          description: >
            Se o arquivo trouxe `E110`. Distingue ausência de apuração de apuração
            zerada, que não são a mesma coisa.
        has_ipi_assessment: { type: boolean }
        rejected:
          type: array
          description: Registros recusados, com a linha e o motivo. Um ruim não derruba os bons.
          items:
            type: object
            properties:
              line: { type: integer }
              record: { type: string }
              reason: { type: string }
        counts:
          type: object
          description: Registros lidos por tipo, para conferir o que entrou.
          additionalProperties: { type: integer }
        event_seq: { type: integer }
        projection_hash: { type: string }

    IcmsIpiCheck:
      type: object
      required: [checkId, name, rule, status, severity, issues]
      properties:
        checkId: { type: string }
        name: { type: string }
        rule:
          type: string
          description: A regra conferida, com a origem no guia. Vai para a tela e para o Book.
        status: { type: string, enum: [passed, failed, not_verified] }
        severity: { type: string, enum: [low, medium, high, critical] }
        notVerifiedReason:
          type: string
          nullable: true
          description: >
            Por que não deu para conferir; `null` quando conferiu. `not_verified`
            sem motivo é indistinguível de desleixo — quem lê precisa saber se
            falta arquivo, falta registro ou falta suporte nosso.
        declaredCents: { type: integer, nullable: true }
        expectedCents: { type: integer, nullable: true }
        differenceCents: { type: integer, nullable: true }
        issues:
          type: array
          items:
            type: object
            properties:
              subject: { type: string }
              message: { type: string }
              differenceCents: { type: integer }

    IcmsIpiReconciliation:
      type: object
      required:
        [period, kind, layout_version, imported_at, checks, totalDifferenceCents,
         failedCount, notVerifiedCount]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        kind: { type: string, enum: [original, retificadora] }
        layout_version: { type: string }
        imported_at: { type: string, format: date-time }
        checks:
          type: array
          items: { $ref: "#/components/schemas/IcmsIpiCheck" }
        totalDifferenceCents:
          type: integer
          description: Soma das diferenças absolutas só das conferências que falharam.
        failedCount: { type: integer }
        notVerifiedCount:
          type: integer
          description: >
            Quantas não puderam ser conferidas. Aparece ao lado das que falharam
            para que "nenhuma falha" nunca seja lido como "tudo conferido".

    CreditBackingCheck:
      type: object
      required: [accessKey, period, status, reason, declared, differenceCents]
      properties:
        accessKey: { type: string, nullable: true }
        period: { $ref: "#/components/schemas/PeriodId" }
        documentNumber: { type: string, nullable: true }
        status:
          type: string
          enum: [lastreado, divergente, sem_documento, nao_verificavel, sem_chave]
          description: >
            `sem_documento` = escriturado, ausente da base, competência coberta —
            é o que o pente-fino cobra. `nao_verificavel` = competência fora da
            janela de cobertura: a ausência é da nossa coleta, e **não** indício
            de crédito indevido. `sem_chave` = nota em papel, que não é erro.
        reason: { type: string, description: "Nunca vazio." }
        declared:
          type: object
          description: O que a EFD declarou.
          properties:
            pisCents: { type: integer }
            cofinsCents: { type: integer }
        found:
          type: object
          nullable: true
          description: O que a nossa base tem; `null` quando não há documento.
          properties:
            pisCents: { type: integer }
            cofinsCents: { type: integer }
        differenceCents: { type: integer }

    CarriedCreditAssessment:
      type: object
      required: [tax, originPeriod, creditCode, finalBalanceCents, withinCoverage, note]
      properties:
        tax: { type: string, enum: [pis, cofins] }
        originPeriod: { $ref: "#/components/schemas/PeriodId" }
        creditCode: { type: string }
        origin: { type: string }
        apuredCents: { type: integer }
        availableCents: { type: integer }
        usedCents: { type: integer }
        refundedCents: { type: integer }
        finalBalanceCents: { type: integer }
        withinCoverage:
          type: boolean
          description: >
            `false` não diz nada sobre o crédito: diz que este sistema não tem os
            documentos daquele mês, e portanto não pode confirmá-lo nem negá-lo.
        note: { type: string }

    CreditDossier:
      type: object
      required: [period, kind, imported_at, coverage, checks, carried, summary]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        kind: { type: string, enum: [original, retificadora] }
        imported_at: { type: string, format: date-time }
        coverage:
          type: object
          description: Competências com documento ingerido. É o que delimita o que dá para conferir.
          properties:
            from: { type: string, nullable: true }
            to: { type: string, nullable: true }
            periods:
              type: array
              items: { type: string }
        checks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/CreditBackingCheck" }
        carried:
          type: array
          items: { $ref: "#/components/schemas/CarriedCreditAssessment" }
        summary:
          type: object
          properties:
            documentsChecked: { type: integer, description: "Total exato, mesmo com o detalhe cortado." }
            lastreado: { type: integer }
            divergente: { type: integer }
            sem_documento: { type: integer }
            nao_verificavel: { type: integer }
            sem_chave: { type: integer }
            backedCents: { type: integer }
            unbackedCents:
              type: integer
              description: Crédito escriturado sem XML na base, com a competência coberta.
            unverifiableCents:
              type: integer
              description: >
                Crédito que **não foi conferido** — competência descoberta ou nota
                sem chave. Não é crédito sem lastro, e somar os dois acusaria o
                cliente por limitação nossa.
            divergentCents: { type: integer }
            carriedBalanceCents:
              type: object
              properties:
                pis: { type: integer }
                cofins: { type: integer }
            carriedWithinCoverageRatio:
              type: number
              description: "Fração em VALOR do saldo credor cuja origem está coberta. Sem saldo, é 1."

    Job:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        kind: { type: string, enum: [dfe_sync, sped_import, bank_statement_import, book_generation] }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        accepted: { type: integer }
        rejected: { type: integer }
        error: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: Resumo da execução. Na coleta de DF-e, lotes, NSUs, documentos, resumos e ciências.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    Event:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_seq: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, agent, orchestrator, system] }
            id: { type: string }
        action: { type: string, example: "doc.received" }
        cnpj: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        payload: { type: object }

    WriteResult:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_seq: { type: integer }
        action: { type: string }
        projection_hash: { type: string }
        state: { $ref: "#/components/schemas/PeriodState" }

    Rejection:
      type: object
      properties:
        rejected: { type: boolean, enum: [true] }
        filename:
          type: string
          description: |
            Arquivo que foi recusado. Presente nas rejeições do `207` de
            ingestão — sem ele, num lote de 200 XMLs a tela sabe que houve
            recusa e não sabe de qual arquivo.
        layer: { type: integer, minimum: 1, maximum: 7 }
        reason: { $ref: "#/components/schemas/RejectionReason" }
        message: { type: string }
        details: { type: object }
        rejection_event_seq: { type: integer, description: Seq do `output.rejected` gravado }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
