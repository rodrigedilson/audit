openapi: 3.0.3
info:
  title: audit — API fiscal (ESAA-Flow)
  version: 0.7.0
  description: |
    Contrato mínimo para destravar o frontend (Lovable). Toda escrita passa pelo
    orquestrador single-writer: o cliente envia uma *intenção*; a API valida
    (7 camadas), grava o evento e re-projeta. Leituras vêm da projeção.

    Convenções:
    - Identificadores em inglês; mensagens de erro em PT-BR.
    - `cnpj` sempre com 14 dígitos, sem máscara.
    - `period` no formato `YYYY-MM` (competência).
    - Toda resposta de escrita devolve o `event_seq` gravado e o `projection_hash`.
servers:
  - url: http://localhost:3000/v1
    description: desenvolvimento
  - url: https://api.SEU-DOMINIO.com.br/v1
    description: produção

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: portfolio
    description: Carteira do escritório (CNPJs, regimes, períodos)
  - name: ingestion
    description: Entrada de documentos fiscais, SPED e extratos
  - name: catalog
    description: Cadastro de itens e saúde de classificação
  - name: assessment
    description: Apuração dual (tributos atuais × IBS/CBS)
  - name: credit
    description: Crédito em risco por fornecedor, extrato bancário e casamento de pagamento
  - name: reconciliation
    description: Contra-apuração, crédito em risco, prazos
  - name: simulation
    description: Cenários Integrado × Híbrido × Presumido
  - name: reporting
    description: Trilhas de auditoria e Book de fechamento
  - name: certificates
    description: Cofre de certificados A1 com log de uso
  - name: assistant
    description: Assistente fiscal somente leitura sobre o event log
  - name: events
    description: Event log e verificação de projeção

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login do usuário do escritório
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      summary: Usuário e tenant atuais
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tenant: { $ref: "#/components/schemas/Tenant" }

  # ----------------------------------------------------------- portfolio
  /clients:
    get:
      tags: [portfolio]
      summary: Lista CNPJs da carteira
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: regime
          schema: { $ref: "#/components/schemas/Regime" }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/PeriodState" }
          description: Filtra pelo estado do período corrente
      responses:
        "200":
          description: Página de clientes com resumo do período corrente
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ClientSummary" }
                  page: { type: integer }
                  total: { type: integer }
    post:
      tags: [portfolio]
      summary: Cadastra um CNPJ (emite `client.enrolled`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreate" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [portfolio]
      summary: Detalhe do cliente
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [portfolio]
      summary: Atualiza regime, certificado ou dados cadastrais
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }

  /clients/{cnpj}/periods:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [portfolio]
      summary: Períodos (competências) do cliente com estado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Period" }
    post:
      tags: [portfolio]
      summary: Abre competência (emite `period.opened`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { $ref: "#/components/schemas/PeriodId" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  # ----------------------------------------------------------- ingestion
  /clients/{cnpj}/documents:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [ingestion]
      summary: Lista documentos fiscais do cliente
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: direction
          schema: { type: string, enum: [inbound, outbound] }
        - in: query
          name: has_issues
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSummary" }
                  total: { type: integer }
    post:
      tags: [ingestion]
      summary: Upload manual de XML (um ou vários; emite `doc.received` por documento aceito)
      description: |
        Cada XML passa pelo pipeline de 7 camadas. Documentos rejeitados não geram
        `doc.received`; geram `output.rejected` e voltam em `rejected[]`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "207":
          description: Resultado por arquivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: array
                    items: { $ref: "#/components/schemas/WriteResult" }
                  rejected:
                    type: array
                    items: { $ref: "#/components/schemas/Rejection" }

  /clients/{cnpj}/documents/{access_key}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - in: path
        name: access_key
        required: true
        description: Chave de acesso (44 dígitos)
        schema: { type: string, pattern: "^[0-9]{44}$" }
    get:
      tags: [ingestion]
      summary: Documento com itens, tributos atuais e IBS/CBS lado a lado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }

  /clients/{cnpj}/sync:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [ingestion]
      summary: Dispara coleta na distribuição DF-e (assíncrono)
      responses:
        "202":
          description: Job aceito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /clients/{cnpj}/sped:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [ingestion]
      summary: Importa arquivo SPED (EFD ICMS/IPI ou EFD-Contribuições)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [efd_icms_ipi, efd_contribuicoes] }
      responses:
        "202":
          description: Job aceito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /clients/{cnpj}/bank-statements:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [credit]
      operationId: importBankStatement
      summary: Importa extrato (OFX ou CSV) e refaz o casamento com os documentos de entrada
      description: >
        O extrato é informação **fiscal** nesta rota, e não financeira: o crédito
        de IBS/CBS é condicionado à extinção do tributo da etapa anterior, e sob
        split payment a extinção acontece na liquidação. Sem saber se o
        fornecedor foi pago, não há como dizer nada sobre o crédito.


        Síncrono, e `201` em vez de `202` com job: o parse e o casamento são
        rápidos, e enfileirar sem consumidor deixaria o escritório esperando um
        job que nunca sai de `queued`. O caminho de open finance continua sendo o
        desejável, e quando existir entra como outra origem do mesmo módulo.


        A importação é **idempotente pelo `FITID`** do OFX (ou pela coluna `id` do
        CSV): o mesmo extrato enviado duas vezes não dobra o pagamento, e
        `lines_duplicated` diz quantas linhas já existiam — para o usuário não
        concluir que o arquivo não entrou.


        Depois de gravar, o casamento pagamento × documento é refeito por
        inteiro. Ver `POST /payment-matches`.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          text/plain:
            schema: { type: string, description: "OFX, que é SGML e não XML." }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Extrato importado e casamento refeito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementImportOutcome" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/payment-matches:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [credit]
      operationId: rematchPayments
      summary: Refaz o casamento pagamento × documento, sem importar nada
      description: >
        Útil depois de ingerir documentos novos: um lançamento que não tinha
        candidato passa a ter, e uma ambiguidade pode se resolver.


        Refeito por inteiro, e não incremental: um lançamento novo pode desfazer
        uma ambiguidade anterior, e um casamento incremental manteria a hipótese
        velha ao lado da nova.


        **Não grava evento fiscal**: casamento é conclusão sobre dados já no log,
        não fato novo.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [matches, total, ambiguous]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentMatch" }
                  total: { type: integer }
                  ambiguous:
                    type: integer
                    description: Casamentos que o sistema recusou resolver. Precisam de decisão humana.
        "403": { $ref: "#/components/responses/Forbidden" }

  /jobs/{job_id}:
    get:
      tags: [ingestion]
      summary: Status de job assíncrono
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  # ------------------------------------------------------------- catalog
  /clients/{cnpj}/items:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [catalog]
      summary: Itens do cadastro com saúde de classificação
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: health
          schema: { type: string, enum: [ok, warning, error] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  total: { type: integer }

  /clients/{cnpj}/items/{item_id}/classification:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - in: path
        name: item_id
        required: true
        schema: { type: string }
    put:
      tags: [catalog]
      summary: Confirma classificação (emite `item.classified` / `item.reclassified`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Classification" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/items/health:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [catalog]
      summary: Resumo da saúde do cadastro e impacto nas notas emitidas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogHealth" }

  # ---------------------------------------------------------- assessment
  /clients/{cnpj}/assessments/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [assessment]
      summary: Apuração dual da competência (projeção + hash)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [assessment]
      summary: (Re)projeta a apuração (emite `assessment.projected`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/assessments/{period}/adjustments:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    post:
      tags: [assessment]
      summary: Registra ajuste manual justificado (emite `assessment.adjusted`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Adjustment" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/assessments/{period}/confirm:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    post:
      tags: [assessment]
      summary: Confirma e fecha o período (emite `assessment.confirmed` + `period.closed`; terminal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projection_hash]
              properties:
                projection_hash:
                  type: string
                  description: Hash que o usuário viu na tela; se divergir do atual, a confirmação é rejeitada (`verification_mismatch`)
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Rejected" }

  # ------------------------------------------------------ reconciliation
  /clients/{cnpj}/fisco-assessments/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [reconciliation]
      operationId: getFiscoComparison
      summary: Contra-apuração — nossa apuração × proposta do Fisco, nota a nota
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscoComparison" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [reconciliation]
      operationId: uploadFiscoAssessment
      summary: Envia a proposta do Fisco e compara (emite `assessment.compared`)
      description: >
        O layout do CSV é **nosso**, não da RFB: o formato oficial de exposição da
        apuração assistida ainda está em piloto. Duas formas de envio, o corpo cru
        como `text/csv` e o `multipart/form-data` com um arquivo.


        Duas colunas decidem o modo. Com `chave_acesso`, a proposta é nota a nota
        e a comparação acontece; sem ela, é só totais por tributo, e
        `line_level: false` diz que a comparação nota a nota **não foi feita** —
        zero divergência de item ali não significa que as notas conferem.


        Cabeçalho nota a nota:
        `chave_acesso;item;tributo;sentido;base;aliquota;valor`.
        Cabeçalho só de totais: `tributo;valor`.


        Exige a competência apurada: sem a nossa apuração não há o que comparar,
        e registrar a proposta sozinha daria a impressão de conferência que não
        aconteceu (`422`, camada 4).


        Uma proposta nova substitui a anterior por inteiro, inclusive as
        divergências — manter as duas daria dois números para a mesma competência
        e nenhum deles defensável.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Proposta registrada e comparada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscoComparisonOutcome" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/credits/at-risk:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/Period"
    get:
      tags: [credit]
      operationId: getCreditRisk
      summary: Crédito por fornecedor e estado, derivado na leitura
      description: |
        O diferencial #7: "players fiscais não olham o banco".

        **O que o sistema não sabe, e não finge saber:** se o fornecedor recolheu
        o tributo dele. Essa informação é do Fisco e não há fonte para ela hoje.
        Por isso `released` exige evidência explícita e vai ficar em zero
        enquanto a fonte não existir — o que é a verdade, e a tela tem de dizer
        em vez de esconder.

        **O que ele sabe, e basta para um achado defensável:** se *nós* pagamos o
        fornecedor. Sem liquidação não há split payment; sem split payment o
        crédito não se extingue. O não-pagamento é o sinal de risco observável.

        O estado **não é gravado**: é derivado a cada leitura. Gravá-lo
        congelaria o estado na data do cálculo, e o crédito condicionado que
        envelhece sem pagamento é justamente o achado.

        `statements_imported: false` significa que nenhum extrato foi importado —
        e nesse caso todo crédito da reforma aparece condicionado por falta de
        pagamento identificado, o que é indistinguível de "o cliente não pagou
        ninguém". A tela precisa da diferença.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditRiskReport" }

  /deadlines:
    get:
      tags: [reconciliation]
      operationId: getPortfolioCalendar
      summary: Calendário da carteira — prazos datados e pendências, em listas separadas
      description: >
        As duas listas são separadas de propósito. Um **prazo** tem data e, quando
        `nature: normativo`, base legal: perdê-lo tem consequência jurídica. Uma
        **pendência** sai do estado do sistema (competência encerrada e não
        apurada, proposta do Fisco sem resposta) e não tem data de lei nenhuma.
        Dar a mesma cara às duas faria o escritório tratar um alvo interno como
        prazo de norma.


        `normative_rules_loaded: false` significa que nenhum prazo normativo está
        carregado — e portanto que a lista vazia de prazos não é "nada a vencer".
        A tabela nasce vazia porque as datas citadas por terceiros no briefing não
        foram conferidas em texto oficial.
      parameters:
        - in: query
          name: horizon_days
          description: Janela em dias. Prazo já vencido aparece com `days_left` negativo.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioCalendar" }

  # ---------------------------------------------------------- simulation
  /simulations/methodology:
    get:
      tags: [simulation]
      operationId: getSimulationMethodology
      summary: O que o simulador compara, o que não modela e por quê
      description: >
        Independe de CNPJ e serve à página pública. A lista `not_modeled` existe
        porque um simulador sem ela induz o contador a tratar a saída como
        cálculo: cada item é uma razão concreta para não decidir só por este
        número.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [compares, excluded, not_modeled, reads_only, writes_fiscal_event, explains]
                properties:
                  compares:
                    type: array
                    items: { $ref: "#/components/schemas/Regime" }
                  excluded:
                    type: array
                    items:
                      type: object
                      properties:
                        regime: { $ref: "#/components/schemas/Regime" }
                        reason: { type: string }
                  not_modeled:
                    type: array
                    items: { type: string }
                  reads_only: { type: boolean }
                  writes_fiscal_event: { type: boolean }
                  explains:
                    type: array
                    items: { type: string }

  /clients/{cnpj}/simulations:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [simulation]
      operationId: listSimulations
      summary: Simulações registradas para o cliente, da mais recente para a mais antiga
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [simulations, total]
                properties:
                  simulations:
                    type: array
                    items: { $ref: "#/components/schemas/StoredSimulation" }
                  total: { type: integer }
    post:
      tags: [simulation]
      operationId: runSimulation
      summary: Simula regimes sobre os dados reais do cliente (somente leitura)
      description: |
        **Não grava evento fiscal.** O serviço não recebe o orquestrador, então
        não existe caminho de código até o log. A simulação fica registrada em
        tabela própria, porque a recomendação orienta a escolha de regime para
        toda a transição e o escritório precisa poder mostrar depois com que
        premissas aconselhou.

        A base é **medida nos documentos**, não perguntada: receita, compras e a
        fração da receita faturada contra PJ saem das notas do período. Essa
        última é o número que decide se a perda do crédito repassável dói, e é
        justamente o que o cliente não sabe responder de cabeça.

        Sem documento no período, a simulação é recusada com `422`: qualquer
        número seria inventado.

        Todo `override` entra no relatório como premissa `provided`, com a nota
        do que ela depende. A alíquota de referência só sai como `published`
        quando IBS-UF, IBS-Mun e CBS estiverem **todas** publicadas em
        `tax_rules` — somar duas daria um número menor com cara de completo.

        MEI e Lucro Real recebem `403` com o motivo: o primeiro tem limite de
        receita e regra própria, o segundo depende de apuração de resultado que
        este simulador não faz.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationRequest" }
      responses:
        "201":
          description: Simulação executada e registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredSimulation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Rejected" }

  # ----------------------------------------------------------- reporting
  /audit-trails:
    get:
      tags: [reporting]
      operationId: listAuditTrails
      summary: Catálogo das trilhas que este sistema executa (nome, camada, severidade)
      description: >
        Público dentro do tenant e independente de competência. A lista é o que o
        produto confere de fato — não uma lista de verificações da RFB.
      parameters:
        - in: query
          name: regime
          required: false
          schema: { $ref: "#/components/schemas/Regime" }
          description: Filtra as trilhas aplicáveis ao regime.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trails, total]
                properties:
                  trails:
                    type: array
                    items: { $ref: "#/components/schemas/AuditTrailDefinition" }
                  total: { type: integer }

  /clients/{cnpj}/audit-trails/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [reporting]
      operationId: getAuditTrailResults
      summary: Resultado das trilhas da competência, agrupado por trilha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditTrailReport" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/books/{period}:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
    get:
      tags: [reporting]
      operationId: listBooks
      summary: Books de fechamento gerados para a competência, do mais recente ao mais antigo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [books, total]
                properties:
                  books:
                    type: array
                    items: { $ref: "#/components/schemas/Book" }
                  total: { type: integer }
    post:
      tags: [reporting]
      operationId: generateBook
      summary: Gera o Book de fechamento (emite `book.generated`)
      description: >
        Síncrono: responde `201` com os metadados do Book já renderizado. Os bytes
        do PDF ficam guardados e o download não os regera — o hash impresso no
        rodapé tem de continuar valendo depois que uma regra mudar.
        Exige a competência apurada; uma competência apenas aberta é recusada com
        `422`. Gerar o Book de uma competência **confirmada** é permitido: é o caso
        de uso previsto, e a camada 6 não o trata como mutação.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                audience:
                  type: string
                  enum: [accountant, business_owner]
                  default: accountant
                include_trace:
                  type: boolean
                  description: >
                    Memória de cálculo em anexo. Por omissão sai `true`, exceto
                    quando `audience` é `business_owner`.
                white_label:
                  type: boolean
                  default: false
                  description: Omite a marca do produto; disponível de Lucro Presumido para cima.
      responses:
        "201":
          description: Book gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Rejected" }

  /clients/{cnpj}/books/{period}/{book_id}/download:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - $ref: "#/components/parameters/PeriodPath"
      - in: path
        name: book_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [reporting]
      operationId: downloadBook
      summary: Baixa os bytes guardados do PDF (hash da projeção no rodapé de toda página)
      responses:
        "200":
          description: PDF
          headers:
            X-Book-SHA256:
              description: >
                SHA-256 do próprio arquivo, para o destinatário conferir o PDF que
                recebeu sem precisar abri-lo.
              schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------- certificates
  /clients/{cnpj}/certificate:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [certificates]
      summary: Metadados do certificado A1 do cliente (nunca retorna o PFX)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [certificates]
      summary: Armazena ou substitui o certificado (emite `certificate.stored`; PFX cifrado em repouso)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pfx, password]
              properties:
                pfx: { type: string, format: binary }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "422": { $ref: "#/components/responses/Rejected" }
    delete:
      tags: [certificates]
      summary: Remove o certificado (emite `certificate.removed`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }

  /clients/{cnpj}/certificate/usage:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [certificates]
      summary: Log de uso do certificado (projeção dos eventos `certificate.used`)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificateUsage" }
                  total: { type: integer }

  /certificates/expiring:
    get:
      tags: [certificates]
      summary: Certificados da carteira que vencem nos próximos N dias
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 60, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CertificateInfo" }

  # ----------------------------------------------------------- assistant
  /assistant/capabilities:
    get:
      tags: [assistant]
      operationId: getAssistantCapabilities
      summary: O que o assistente sabe responder, e com que camada
      description: >
        Independe de CNPJ. A lista é fechada de propósito: são as perguntas que o
        produto responde a partir dos dados, com citação conferível. Pergunta fora
        dela recebe "não sei, e eis o que sei" — `deterministic_only: true` diz
        exatamente isso, e `language_model_configured: false` diz por quê.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [supported, deterministic_only, language_model_configured]
                properties:
                  supported:
                    type: array
                    items:
                      type: object
                      properties:
                        intent: { type: string }
                        description: { type: string }
                  deterministic_only:
                    type: boolean
                    description: >
                      `true` significa que toda resposta sai de consulta ao banco,
                      é reproduzível e tem citação — nenhum modelo de linguagem no
                      caminho.
                  language_model_configured: { type: boolean }

  /clients/{cnpj}/assistant/usage:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [assistant]
      operationId: getAssistantUsage
      summary: Uso e limite mensal do assistente para este CNPJ
      description: >
        O limite vem do plano do **regime do cliente**, porque é por CNPJ ativo que
        o produto é cobrado. `allowance: 0` significa que o assistente não está
        incluído no plano — e nesse caso as rotas de conversa respondem `403`, não
        `429`: "não contratado" e "acabou o mês" são coisas diferentes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantUsage" }

  /clients/{cnpj}/assistant/threads:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [assistant]
      operationId: listAssistantThreads
      summary: Conversas anteriores com o assistente para este CNPJ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [threads, total]
                properties:
                  threads:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantThread" }
                  total: { type: integer }
    post:
      tags: [assistant]
      operationId: createAssistantThread
      summary: Abre uma conversa
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Conversa aberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantThread" }
        "403":
          description: Assistente não incluído no plano deste CNPJ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clients/{cnpj}/assistant/threads/{thread_id}/messages:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
      - in: path
        name: thread_id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [assistant]
      operationId: listAssistantMessages
      summary: Mensagens da conversa, em ordem
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, total]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantMessage" }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [assistant]
      operationId: askAssistant
      summary: Pergunta ao assistente (somente leitura; nunca grava evento fiscal)
      description: |
        O serviço do assistente **não recebe o orquestrador**: não existe caminho
        de código daqui até o log fiscal. "Não escreve evento" é uma dependência
        ausente, não uma regra a ser respeitada.

        Toda afirmação de `kind: fact` traz ao menos uma citação, e a citação é
        conferida contra as evidências que a consulta de fato trouxe **antes** da
        resposta sair do serviço. Citação inventada é recusada mecanicamente,
        inclusive se vier de um modelo de linguagem.

        Afirmação de `kind: explanation` é texto normativo e não cita dado — e por
        isso não pode conter valor monetário nem competência, o que seria
        contrabandear fato para fora da regra de citação.

        Ação recomendada vem em `suggested`, com rota e corpo prontos. Quem
        executa é o usuário.

        `answerable: false` é resposta de primeira classe, com
        `unanswerableReason` obrigatório: "não sei, e por quê" é verdadeiro,
        enquanto uma resposta plausível sem lastro é o modo de falha que este
        produto não pode ter.

        A pergunta consome a cota mesmo quando a resposta sai como não
        respondível — perguntar consome trabalho de consulta, e não cobrar pelo
        "não sei" abriria caminho para contornar o limite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Resposta do assistente
          headers:
            X-Assistant-Remaining:
              description: Perguntas restantes no mês para este CNPJ.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [answer, usage]
                properties:
                  answer: { $ref: "#/components/schemas/AssistantAnswer" }
                  usage: { $ref: "#/components/schemas/AssistantUsage" }
        "403":
          description: Assistente não incluído no plano deste CNPJ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Limite mensal do plano atingido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      usage: { $ref: "#/components/schemas/AssistantUsage" }

  # -------------------------------------------------------------- events
  /clients/{cnpj}/events:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    get:
      tags: [events]
      summary: Event log do cliente (paginado por `event_seq`)
      parameters:
        - in: query
          name: after_seq
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: action
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  /clients/{cnpj}/verify:
    parameters:
      - $ref: "#/components/parameters/Cnpj"
    post:
      tags: [events]
      summary: Re-executa replay e compara hash da projeção (INV-006)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stored_hash: { type: string }
                  replayed_hash: { type: string }
                  last_event_seq: { type: integer }

# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cnpj:
      in: path
      name: cnpj
      required: true
      schema: { type: string, pattern: "^[0-9]{14}$" }
    Period:
      in: query
      name: period
      schema: { $ref: "#/components/schemas/PeriodId" }
    PeriodPath:
      in: path
      name: period
      required: true
      schema: { $ref: "#/components/schemas/PeriodId" }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: page_size
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Papel sem permissão, ou recurso não incluído no plano
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Rejected:
      description: Intenção rejeitada pelo pipeline (evento `output.rejected` gravado)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Rejection" }

  schemas:
    PeriodId:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      example: "2027-01"

    Regime:
      type: string
      enum: [mei, simples_integrado, simples_hibrido, lucro_presumido, lucro_real]

    PeriodState:
      type: string
      enum: [open, assessed, reconciled, confirmed]

    CreditState:
      type: string
      enum: [expected, conditioned, released, at_risk, lost]

    RejectionReason:
      type: string
      enum:
        - schema_violation
        - unknown_code
        - code_incompatible
        - regime_violation
        - closed_period_violation
        - fisco_mismatch
        - duplicate_document
        - sequence_gap
        - verification_mismatch
        - boundary_violation

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Escritório Exemplo Contabilidade" }
        plan: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, accountant, viewer] }

    ClientCreate:
      type: object
      required: [cnpj, legal_name, regime]
      properties:
        cnpj: { type: string, pattern: "^[0-9]{14}$" }
        legal_name: { type: string }
        trade_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        uf: { type: string, minLength: 2, maxLength: 2 }
        municipality_ibge: { type: string, pattern: "^[0-9]{7}$" }
        cnae_primary: { type: string, example: "6201501" }

    ClientUpdate:
      type: object
      properties:
        trade_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        regime_effective_from: { $ref: "#/components/schemas/PeriodId" }

    Client:
      allOf:
        - $ref: "#/components/schemas/ClientCreate"
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            has_certificate: { type: boolean }
            current_period: { $ref: "#/components/schemas/Period" }

    ClientSummary:
      type: object
      properties:
        cnpj: { type: string }
        legal_name: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        period: { $ref: "#/components/schemas/PeriodId" }
        state: { $ref: "#/components/schemas/PeriodState" }
        documents: { type: integer }
        open_issues: { type: integer }
        credit_at_risk_brl: { type: number }
        next_deadline: { type: string, format: date, nullable: true }

    Period:
      type: object
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        state: { $ref: "#/components/schemas/PeriodState" }
        projection_hash: { type: string, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        confirmed_by: { type: string, nullable: true }

    DocumentSummary:
      type: object
      properties:
        access_key: { type: string }
        model: { type: string, enum: [nfe, nfce, nfse, cte] }
        direction: { type: string, enum: [inbound, outbound] }
        issued_at: { type: string, format: date-time }
        counterparty_cnpj: { type: string }
        counterparty_name: { type: string }
        total_brl: { type: number }
        issues: { type: integer }
        credit_state: { $ref: "#/components/schemas/CreditState" }

    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/DocumentItem" }
            issues:
              type: array
              items: { $ref: "#/components/schemas/Issue" }
            event_seq: { type: integer }

    DocumentItem:
      type: object
      description: Um item da nota com tributos atuais e IBS/CBS lado a lado
      properties:
        line: { type: integer }
        item_id: { type: string, description: Vínculo com o cadastro }
        description: { type: string }
        ncm: { type: string }
        nbs: { type: string, nullable: true }
        cfop: { type: string }
        quantity: { type: number }
        unit_price_brl: { type: number }
        legacy:
          type: object
          description: Tributos atuais destacados
          properties:
            icms: { $ref: "#/components/schemas/TaxLine" }
            ipi: { $ref: "#/components/schemas/TaxLine" }
            pis: { $ref: "#/components/schemas/TaxLine" }
            cofins: { $ref: "#/components/schemas/TaxLine" }
            iss: { $ref: "#/components/schemas/TaxLine" }
        reform:
          type: object
          description: Grupo UB (IBS/CBS) destacado
          properties:
            cst: { type: string, example: "000" }
            cclasstrib: { type: string, example: "000001" }
            ibs_uf: { $ref: "#/components/schemas/TaxLine" }
            ibs_mun: { $ref: "#/components/schemas/TaxLine" }
            cbs: { $ref: "#/components/schemas/TaxLine" }
        expected_reform:
          type: object
          description: O que o motor de regras esperava (para exibir divergência)
          properties:
            cst: { type: string }
            cclasstrib: { type: string }
            cbs_rate: { type: number }
            ibs_rate: { type: number }

    TaxLine:
      type: object
      properties:
        cst: { type: string, nullable: true }
        base_brl: { type: number }
        rate: { type: number }
        amount_brl: { type: number }

    Issue:
      type: object
      properties:
        id: { type: string }
        layer:
          type: integer
          minimum: 1
          maximum: 7
          description: Camada do pipeline que detectou (1 parse … 7 verification-gate)
        reason: { $ref: "#/components/schemas/RejectionReason" }
        severity: { type: string, enum: [low, medium, high, critical] }
        message: { type: string, description: Texto em PT-BR para o contador }
        line: { type: integer, nullable: true }
        suggested_fix: { type: string, nullable: true }

    Item:
      type: object
      properties:
        item_id: { type: string }
        description: { type: string }
        ncm: { type: string }
        nbs: { type: string, nullable: true }
        classification: { $ref: "#/components/schemas/Classification" }
        health: { type: string, enum: [ok, warning, error] }
        health_reasons:
          type: array
          items: { type: string }
        documents_affected: { type: integer }
        last_seen_at: { type: string, format: date-time }

    Classification:
      type: object
      required: [effective_from]
      properties:
        effective_from: { $ref: "#/components/schemas/PeriodId" }
        cst_ibs_cbs: { type: string }
        cclasstrib: { type: string }
        cst_icms: { type: string, nullable: true }
        cst_pis_cofins: { type: string, nullable: true }
        cfop_default: { type: string, nullable: true }
        justification: { type: string }

    CatalogHealth:
      type: object
      properties:
        items_total: { type: integer }
        ok: { type: integer }
        warning: { type: integer }
        error: { type: integer }
        outbound_documents_affected: { type: integer }
        top_reasons:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              count: { type: integer }

    Assessment:
      type: object
      properties:
        cnpj: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        regime: { $ref: "#/components/schemas/Regime" }
        state: { $ref: "#/components/schemas/PeriodState" }
        projection_hash: { type: string }
        last_event_seq: { type: integer }
        legacy:
          type: object
          description: Apuração dos tributos atuais
          additionalProperties: { $ref: "#/components/schemas/TaxTotals" }
          example:
            icms: { debits_brl: 1000, credits_brl: 400, due_brl: 600 }
            pis: { debits_brl: 100, credits_brl: 0, due_brl: 100 }
        reform:
          type: object
          properties:
            cbs: { $ref: "#/components/schemas/TaxTotals" }
            ibs_uf: { $ref: "#/components/schemas/TaxTotals" }
            ibs_mun: { $ref: "#/components/schemas/TaxTotals" }
            credits_by_state:
              type: object
              description: Créditos por estado (expected / conditioned / released / at_risk)
              additionalProperties: { type: number }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/Adjustment" }
        open_issues: { type: integer }
        calculation_trace_url:
          type: string
          description: Link para memória de cálculo completa (nota a nota)

    TaxTotals:
      type: object
      properties:
        debits_brl: { type: number }
        credits_brl: { type: number }
        due_brl: { type: number }
        carryover_brl: { type: number, description: Saldo credor a transportar }

    Adjustment:
      type: object
      required: [tax, amount_brl, reason]
      properties:
        id: { type: string, readOnly: true }
        tax: { type: string, example: "cbs" }
        amount_brl: { type: number, description: Positivo aumenta débito; negativo reduz }
        reason: { type: string }
        reference_access_key: { type: string, nullable: true }
        created_by: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    PaymentMatch:
      type: object
      required: [accessKey, fitid, confidence, rationale]
      description: >
        Todo casamento é HIPÓTESE. Valor e data iguais não provam que aquele
        pagamento é daquela nota, e casar errado reportaria crédito liberado que
        não está.
      properties:
        accessKey: { type: string }
        fitid: { type: string, description: "Identificador do lançamento no extrato." }
        confidence:
          type: string
          enum: [exact, amount_and_date, amount_only, ambiguous]
          description: >
            `exact` = a chave ou o número da nota aparece no histórico do
            lançamento. `amount_and_date` = hipótese forte. `amount_only` =
            hipótese fraca, data fora da janela. `ambiguous` = mais de um
            candidato, e o sistema **não escolhe**.
        rationale: { type: string, description: "Por que o casamento foi feito. É o que o contador confere." }
        candidates:
          type: array
          items: { type: string }
          description: Só no ambíguo — as chaves candidatas, para a decisão humana.

    StatementImportOutcome:
      type: object
      required:
        [statement_id, source, reference, lines_imported, lines_duplicated,
         rejected, matches, ambiguous, event_seq, projection_hash]
      properties:
        statement_id: { type: string, format: uuid }
        source: { type: string, enum: [ofx, csv] }
        reference: { type: string }
        account: { type: string, nullable: true }
        period_from: { type: string, format: date, nullable: true }
        period_to: { type: string, format: date, nullable: true }
        lines_imported: { type: integer }
        lines_duplicated:
          type: integer
          description: "Linhas que já existiam pelo FITID. Reimportar não dobra o pagamento."
        rejected:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              content: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/PaymentMatch" }
        ambiguous: { type: integer }
        event_seq: { type: integer }
        projection_hash: { type: string }

    CreditPosition:
      type: object
      required: [accessKey, period, tax, supplierCnpj, amountCents, state, reason, hasReformGroup]
      properties:
        accessKey: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        tax: { type: string }
        supplierCnpj: { type: string }
        supplierName: { type: string, nullable: true }
        amountCents: { type: integer }
        hasReformGroup: { type: boolean }
        state:
          type: string
          enum: [expected, conditioned, released, at_risk, lost]
          description: >
            `expected` = não depende de liquidação (tributo do sistema antigo, ou
            documento sem grupo UB). `conditioned` = depende da extinção da etapa
            anterior. `at_risk` = condicionado e sem pagamento identificado há
            tempo. `released` exige evidência de extinção, que não tem fonte hoje.
            `lost` **nunca** é derivado: declarar crédito perdido é decisão do
            contador, com consequência contábil.
        reason: { type: string, description: "Por que está neste estado. Nunca vazio." }
        unpaidDays: { type: integer, nullable: true }

    SupplierCreditRisk:
      type: object
      required:
        [supplierCnpj, documents, creditExpectedCents, creditConditionedCents,
         creditReleasedCents, creditAtRiskCents, emitsReformGroup]
      properties:
        supplierCnpj: { type: string }
        supplierName: { type: string, nullable: true }
        documents: { type: integer }
        creditExpectedCents: { type: integer }
        creditConditionedCents: { type: integer }
        creditReleasedCents: { type: integer }
        creditAtRiskCents: { type: integer }
        oldestUnpaidDays: { type: integer, nullable: true }
        emitsReformGroup:
          type: boolean
          description: >
            Se ALGUM documento deste fornecedor traz o grupo IBS/CBS. Não se chama
            `uses_split_payment`, embora seja esse o nome no briefing: o sistema
            observa o que está no XML, não se o fornecedor usa split payment.

    CreditRiskReport:
      type: object
      required: [statements_imported, suppliers, positions, totals]
      properties:
        period: { type: string, nullable: true }
        statements_imported:
          type: boolean
          description: "`false` = nenhum extrato importado; todo crédito aparece condicionado."
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/SupplierCreditRisk" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/CreditPosition" }
        totals:
          type: object
          properties:
            expectedCents: { type: integer }
            conditionedCents: { type: integer }
            releasedCents: { type: integer }
            atRiskCents: { type: integer }

    Deadline:
      type: object
      required: [cnpj, kind, name, due_date, days_left, severity, nature, state]
      properties:
        cnpj: { type: string }
        legal_name: { type: string, nullable: true }
        regime: { $ref: "#/components/schemas/Regime" }
        period: { type: string, nullable: true }
        kind: { type: string, example: certificado_a1_vencendo }
        name: { type: string }
        due_date: { type: string, format: date }
        days_left: { type: integer, description: "Negativo quando o prazo já venceu." }
        severity: { type: string, enum: [low, medium, high, critical] }
        nature:
          type: string
          enum: [normativo, fato]
          description: >
            `normativo` é prazo de norma e sempre traz `legal_basis`. `fato` é data
            que o sistema conhece — a validade de um certificado A1, por exemplo —
            e não tem base legal porque não é prazo de lei.
        legal_basis: { type: string, nullable: true }
        state: { type: string, enum: [pending, met, missed, dismissed] }

    Pendency:
      type: object
      required: [kind, cnpj, period, name, message, severity, openSince, daysOpen]
      properties:
        kind:
          type: string
          enum:
            - competencia_nao_apurada
            - apuracao_nao_confirmada
            - proposta_do_fisco_sem_resposta
            - proposta_do_fisco_sem_detalhe
        cnpj: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        name: { type: string }
        message: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        openSince:
          type: string
          format: date-time
          description: Substitui a data de vencimento, que para uma pendência não existe.
        daysOpen: { type: integer }

    PortfolioCalendar:
      type: object
      required: [horizon_days, normative_rules_loaded, deadlines, pendencies]
      properties:
        horizon_days: { type: integer }
        normative_rules_loaded: { type: boolean }
        deadlines:
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        pendencies:
          type: array
          items: { $ref: "#/components/schemas/Pendency" }

    Divergence:
      type: object
      required:
        [scope, subject, tax, ourCents, fiscoCents, differenceCents, probableCause, severity]
      properties:
        scope: { type: string, enum: [tributo, documento, item] }
        subject:
          type: string
          description: Chave de acesso, `chave#item` ou o nome do tributo.
        tax: { type: string }
        direction: { type: string, enum: [inbound, outbound], nullable: true }
        accessKey: { type: string, nullable: true }
        line: { type: integer, nullable: true }
        ourCents: { type: integer }
        fiscoCents: { type: integer }
        differenceCents:
          type: integer
          description: Fisco menos nosso. Positivo = o Fisco aponta mais do que escrituramos.
        probableCause:
          type: string
          description: >
            Hipótese, não diagnóstico: o sistema vê duas listas de números, e a
            razão real pode ser erro nosso, erro do Fisco, documento cancelado ou
            nota ainda não processada por um dos lados.
          enum:
            - aliquota_divergente
            - base_divergente
            - base_e_aliquota_divergentes
            - valor_incoerente_com_base_e_aliquota
            - debito_nao_escriturado
            - credito_nao_aproveitado
            - debito_nao_reconhecido_pelo_fisco
            - credito_glosado
            - arredondamento
            - total_nao_explicado_pelas_linhas
            - causa_nao_determinada
        severity: { type: string, enum: [low, medium, high, critical] }

    ComparisonSummary:
      type: object
      required:
        [divergencesCount, exposureCents, creditLossCents, creditAtRiskCents,
         bySeverity, linesCompared, lineLevel]
      properties:
        divergencesCount:
          type: integer
          description: Total exato, mesmo quando a lista de itens vem cortada em 500.
        exposureCents:
          type: integer
          description: Débito que o Fisco aponta e não escrituramos. Será cobrado.
        creditLossCents:
          type: integer
          description: Crédito que o Fisco reconhece e não aproveitamos. Dinheiro na mesa.
        creditAtRiskCents:
          type: integer
          description: Crédito nosso que o Fisco não reconhece. Tende a ser glosado.
        bySeverity:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
        linesCompared: { type: integer, description: "Zero quando a proposta veio só com totais." }
        lineLevel: { type: boolean }

    FiscoComparison:
      type: object
      required:
        [period, source, reference, line_level, lines_count, totals,
         uploaded_at, event_seq, divergences, summary]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        source: { type: string, enum: [manual_upload, official_api] }
        reference:
          type: string
          description: >
            Nome do arquivo ou protocolo. É o que permite ao contador dizer depois
            qual proposta recebeu e quando.
        line_level: { type: boolean }
        lines_count: { type: integer }
        totals:
          type: object
          additionalProperties: { type: integer }
        uploaded_at: { type: string, format: date-time }
        event_seq: { type: integer }
        divergences:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Divergence" }
        summary: { $ref: "#/components/schemas/ComparisonSummary" }

    FiscoComparisonOutcome:
      allOf:
        - $ref: "#/components/schemas/FiscoComparison"
        - type: object
          properties:
            projection_hash: { type: string }
            rejected:
              type: array
              description: Linhas do CSV recusadas. Uma linha ruim não derruba as boas.
              items:
                type: object
                properties:
                  row: { type: integer, description: "Número da linha, contando o cabeçalho como 1." }
                  reason: { type: string }
                  content: { type: string }

    SimulationRequest:
      type: object
      required: [scenario, base_from, base_to]
      properties:
        scenario: { type: string, enum: [transition_2027_2028, full_2033] }
        base_from: { $ref: "#/components/schemas/PeriodId" }
        base_to: { $ref: "#/components/schemas/PeriodId" }
        overrides:
          type: object
          description: >
            Premissas editáveis. Cada uma informada aqui aparece no relatório com
            `origin: provided` — inclusive `b2b_share`, que por omissão é medida
            nas notas.
          properties:
            ibs_cbs_rate: { type: number, minimum: 0, maximum: 100 }
            simples_effective_rate: { type: number, minimum: 0, maximum: 100 }
            creditable_share: { type: number, minimum: 0, maximum: 1 }
            presumed_profit_rate: { type: number, minimum: 0, maximum: 100 }
            tax_lag_days_current: { type: integer, minimum: 0, maximum: 365 }
            b2b_share: { type: number, minimum: 0, maximum: 1 }

    SimulationAssumption:
      type: object
      required: [key, label, value, unit, origin, source]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [percent, brl, days, ratio] }
        origin:
          type: string
          enum: [published, measured, provided]
          description: >
            `published` = regra em `tax_rules`, com a fonte normativa.
            `measured` = medido nos documentos do cliente. `provided` = premissa
            de quem simulou. É o campo que separa cálculo de estimativa.
        source: { type: string, description: "Nunca vazio." }

    SimulationOutcome:
      type: object
      required:
        [regime, directTaxMonthlyCents, creditToB2BCustomersCents,
         economicCostMonthlyCents, workingCapitalExposureCents, breakdown]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        directTaxMonthlyCents:
          type: integer
          description: O que sai do caixa por mês — a guia.
        creditToB2BCustomersCents:
          type: integer
          description: >
            Crédito que o cliente PJ pode aproveitar. **Não reduz a guia**: é
            vantagem competitiva, e sem ele o cliente PJ exige desconto
            equivalente.
        economicCostMonthlyCents:
          type: integer
          description: >
            Guia mais o desconto que o cliente PJ vai exigir por não ter
            crédito. É o número que compara regimes de verdade.
        workingCapitalExposureCents:
          type: integer
          description: >
            Capital de giro exigido pelo adiantamento do tributo. Sob split
            payment o tributo sai na liquidação, e não no vencimento da guia — a
            carga anual pode ser igual e o caixa, não.
        breakdown:
          type: object
          additionalProperties: { type: integer }

    SimulationResult:
      type: object
      required:
        [scenario, base, outcomes, winner, robustness, annualSavingVsWorstCents,
         sensitivity, assumptions, notModeled]
      properties:
        scenario: { type: string }
        base:
          type: object
          description: Medido nos documentos; devolvido junto para conferência.
          properties:
            monthlyRevenueCents: { type: integer }
            monthlyInputsCents: { type: integer }
            b2bShare: { type: number }
            documentsConsidered: { type: integer }
            monthsConsidered: { type: integer }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/SimulationOutcome" }
        winner:
          type: string
          nullable: true
          # Só os regimes comparáveis: MEI e Lucro Real não entram na simulação.
          enum: [simples_integrado, simples_hibrido, lucro_presumido]
          description: >
            `null` quando o vencedor muda dentro da faixa de alíquotas explorada.
            `null` aqui é resposta, e não ausência de resposta: apontar um
            vencedor que depende de alíquota não publicada seria dar recomendação
            com cara de cálculo.
        robustness:
          type: string
          enum: [robust, sensitive]
          description: "`sensitive` anda sempre junto de `winner: null`."
        annualSavingVsWorstCents: { type: integer }
        b2bBreakevenShare:
          type: number
          nullable: true
          description: >
            Fração de receita contra PJ em que o vencedor troca. É o número que o
            contador leva para a conversa. `null` quando o mesmo regime vence de
            0 a 100%.
        sensitivity:
          type: array
          description: Mapa alíquota × fração de crédito → regime vencedor.
          items:
            type: object
            properties:
              ibsCbsRate: { type: number }
              creditableShare: { type: number }
              winner: { $ref: "#/components/schemas/Regime" }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/SimulationAssumption" }
        notModeled:
          type: array
          items: { type: string }

    StoredSimulation:
      type: object
      required: [id, scenario, base_from, base_to, winner, robustness, simulated_at, result]
      properties:
        id: { type: string, format: uuid }
        scenario: { type: string }
        base_from: { $ref: "#/components/schemas/PeriodId" }
        base_to: { $ref: "#/components/schemas/PeriodId" }
        winner:
          type: string
          nullable: true
          enum: [simples_integrado, simples_hibrido, lucro_presumido]
        robustness: { type: string, enum: [robust, sensitive] }
        simulated_at: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/SimulationResult" }

    AuditTrailDefinition:
      type: object
      required: [trailId, name, description, layer, defaultSeverity, taxScope, source, matches]
      properties:
        trailId: { type: string, example: "cclasstrib_vs_cst" }
        name: { type: string, example: "cClassTrib incompatível com CST-IBS/CBS" }
        description: { type: string }
        layer:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: Camada do pipeline que detecta a trilha; `null` quando não vem de uma camada.
        defaultSeverity: { type: string, enum: [low, medium, high, critical] }
        taxScope:
          type: string
          enum: [legacy, reform, both, none]
          description: Sistema tributário a que a trilha se refere.
        source:
          type: string
          enum: [output_rejected, item_classification, assessment, period_state]
          description: Onde a trilha busca as inconsistências que agrupa.
        matches:
          type: array
          items: { type: string }
          description: Motivos (ou estados de competência) que a trilha reconhece.

    AuditTrailIssue:
      type: object
      required: [subject, message, severity]
      properties:
        subject:
          type: string
          description: Chave de acesso, id de item, tributo ou nome de arquivo.
        message: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        layer: { type: integer, minimum: 1, maximum: 7 }
        documentsAffected: { type: integer }
        amountAtStakeCents: { type: integer }

    AuditTrailResult:
      type: object
      required:
        [trailId, name, description, layer, severity, taxScope, status,
         issuesCount, amountAtStakeCents, documentsAffected, issues]
      properties:
        trailId: { type: string }
        name: { type: string }
        description: { type: string }
        layer: { type: integer, nullable: true }
        severity: { type: string, enum: [low, medium, high, critical] }
        taxScope: { type: string, enum: [legacy, reform, both, none] }
        status:
          type: string
          enum: [passed, warning, failed, not_applicable]
          description: >
            `not_applicable` significa **não conferido** — a tabela oficial de
            códigos não estava carregada. Não é equivalente a `passed`.
        issuesCount:
          type: integer
          description: Total exato de ocorrências, mesmo quando `issues` vem amostrado.
        amountAtStakeCents: { type: integer }
        documentsAffected: { type: integer }
        issues:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AuditTrailIssue" }
          description: Amostra de até 25 ocorrências; o total está em `issuesCount`.

    AuditTrailsSummary:
      type: object
      required: [passed, warning, failed, not_applicable, amountAtStakeCents]
      properties:
        passed: { type: integer }
        warning: { type: integer }
        failed: { type: integer }
        not_applicable: { type: integer }
        amountAtStakeCents: { type: integer }

    AuditTrailReport:
      type: object
      required:
        [period, period_state, projection_hash, reference_tables_loaded, trails, summary]
      properties:
        period: { $ref: "#/components/schemas/PeriodId" }
        period_state: { type: string, enum: [open, assessed, reconciled, confirmed] }
        projection_hash: { type: string }
        reference_tables_loaded:
          type: boolean
          description: >
            `false` significa que as trilhas de código não conferiram nada, e as
            que dependem delas vêm como `not_applicable`.
        trails:
          type: array
          items: { $ref: "#/components/schemas/AuditTrailResult" }
        summary: { $ref: "#/components/schemas/AuditTrailsSummary" }

    Book:
      type: object
      required:
        [id, period, audience, white_label, include_trace, projection_hash,
         trails_summary, pages, pdf_bytes, pdf_sha256, event_seq, generated_at]
      properties:
        id: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/PeriodId" }
        audience: { type: string, enum: [accountant, business_owner] }
        white_label: { type: boolean }
        include_trace: { type: boolean }
        projection_hash:
          type: string
          description: Hash da projeção no instante da geração; impresso no rodapé de toda página.
        trails_summary: { $ref: "#/components/schemas/AuditTrailsSummary" }
        pages: { type: integer }
        pdf_bytes: { type: integer }
        pdf_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 do arquivo, devolvido também no cabeçalho `X-Book-SHA256`.
        event_seq: { type: integer, description: Seq do `book.generated` no log. }
        generated_at: { type: string, format: date-time }

    CertificateInfo:
      type: object
      properties:
        cnpj: { type: string }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        days_to_expiry: { type: integer }
        stored_at: { type: string, format: date-time }
        stored_by: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        usage_count_30d: { type: integer }

    CertificateUsage:
      type: object
      description: Projeção de um evento `certificate.used`
      properties:
        event_seq: { type: integer }
        used_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, agent, system] }
            id: { type: string }
        purpose:
          type: string
          enum: [dfe_distribution, nfse_query, manifestation, sped_transmission, other]
        target: { type: string, description: Serviço/URL acessado }
        outcome: { type: string, enum: [success, failure] }
        ip: { type: string, nullable: true }

    AssistantUsage:
      type: object
      required: [used, allowance, remaining]
      properties:
        used: { type: integer }
        allowance:
          type: integer
          description: "Zero significa que o assistente não está incluído no plano do regime."
        remaining: { type: integer }

    AssistantThread:
      type: object
      required: [id, cnpj, title, created_at, messages_count]
      properties:
        id: { type: string, format: uuid }
        cnpj: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        messages_count: { type: integer }

    AssistantCitation:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [event, document, assessment_line, divergence, item, period]
        eventSeq:
          type: integer
          nullable: true
          description: Posição no log deste CNPJ. Conferível pelo `POST /verify`.
        accessKey: { type: string, nullable: true }
        line: { type: integer, nullable: true }
        tax: { type: string, nullable: true }
        itemId: { type: string, nullable: true }
        period: { type: string, nullable: true }
        label: { type: string, description: "Rótulo curto para a tela; nunca substitui os campos acima." }

    AssistantClaim:
      type: object
      required: [kind, text, citations]
      properties:
        kind:
          type: string
          enum: [fact, explanation]
          description: >
            `fact` afirma algo sobre os dados deste CNPJ e sempre traz citação.
            `explanation` é texto normativo, não cita dado, e não pode conter
            valor monetário nem competência.
        text: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/AssistantCitation" }

    AssistantSuggestedIntention:
      type: object
      required: [action, method, endpoint, rationale]
      description: Ação que o usuário pode executar. O assistente nunca a executa.
      properties:
        action: { type: string, example: "assessment.projected" }
        method: { type: string, enum: [GET, POST] }
        endpoint: { type: string, example: "/v1/clients/{cnpj}/assessments/2027-09" }
        payload: { type: object }
        rationale: { type: string }

    AssistantAnswer:
      type: object
      required: [intent, tier, confidence, answerable, claims, suggested]
      properties:
        intent: { type: string, example: valor_devido }
        tier:
          type: integer
          enum: [1, 3]
          description: >
            1 = consulta determinística, reproduzível, sem modelo nenhum.
            3 = exigiria raciocínio livre de um modelo de linguagem. A camada 2
            do ADR-026 é classificação de item em lote, trabalho do catálogo e
            não de conversa.
        confidence: { type: string, enum: [high, medium, low] }
        answerable: { type: boolean }
        unanswerableReason:
          type: string
          nullable: true
          description: Obrigatório quando `answerable` é `false`.
        claims:
          type: array
          items: { $ref: "#/components/schemas/AssistantClaim" }
        suggested:
          type: array
          items: { $ref: "#/components/schemas/AssistantSuggestedIntention" }

    AssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content:
          type: string
          description: A resposta lida de cima a baixo; as afirmações citadas estão em `claims`.
        intent: { type: string, nullable: true }
        tier: { type: integer, nullable: true }
        confidence: { type: string, enum: [high, medium, low], nullable: true }
        answerable: { type: boolean, nullable: true }
        claims:
          type: array
          items: { $ref: "#/components/schemas/AssistantClaim" }
        suggested:
          type: array
          items: { $ref: "#/components/schemas/AssistantSuggestedIntention" }
        created_at: { type: string, format: date-time }

    Job:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        kind: { type: string, enum: [dfe_sync, sped_import, bank_statement_import, book_generation] }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        accepted: { type: integer }
        rejected: { type: integer }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    Event:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_seq: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, agent, orchestrator, system] }
            id: { type: string }
        action: { type: string, example: "doc.received" }
        cnpj: { type: string }
        period: { $ref: "#/components/schemas/PeriodId" }
        payload: { type: object }

    WriteResult:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_seq: { type: integer }
        action: { type: string }
        projection_hash: { type: string }
        state: { $ref: "#/components/schemas/PeriodState" }

    Rejection:
      type: object
      properties:
        rejected: { type: boolean, enum: [true] }
        layer: { type: integer, minimum: 1, maximum: 7 }
        reason: { $ref: "#/components/schemas/RejectionReason" }
        message: { type: string }
        details: { type: object }
        rejection_event_seq: { type: integer, description: Seq do `output.rejected` gravado }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
